<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300,0,0&display=block">
<style>
/* Layout: menu lateral fixo + área de trabalho com uma tela por seção; no celular o menu vira barra inferior */
:root{
  --bg:#F3F3F1; --panel:#FFFFFF; --soft:#EFEFEC; --ink:#17181B; --ink2:#55575E; --ink3:#8B8D94; --line:#E3E3DF; --line2:#CFCFCA;
  --accent:#D3460E; --accent-soft:#FCE9DF; --on-accent:#FFFFFF;
  --good:#1D7A4D; --bad:#BF3627; --warn:#9A5800;
  --me:#DCF1E2; --on-me:#11301F;
  --rua:#C9501A; --pista:#6A3CCF; --feed:#C2185B; --sala:#0F7A88;
  --sans:'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101113; --panel:#17181B; --soft:#202125; --ink:#ECECEE; --ink2:#A8A9AF; --ink3:#73757C; --line:#26272B; --line2:#37383D;
  --accent:#FF6A2B; --accent-soft:#3A2116; --on-accent:#1A0A02;
  --good:#4CC38A; --bad:#FF6F61; --warn:#E3A34A; --me:#1D3A29; --on-me:#D5F3E0;
  --rua:#F0793F; --pista:#9C7BFF; --feed:#F25595; --sala:#3CC0D0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101113; --panel:#17181B; --soft:#202125; --ink:#ECECEE; --ink2:#A8A9AF; --ink3:#73757C; --line:#26272B; --line2:#37383D;
  --accent:#FF6A2B; --accent-soft:#3A2116; --on-accent:#1A0A02;
  --good:#4CC38A; --bad:#FF6F61; --warn:#E3A34A; --me:#1D3A29; --on-me:#D5F3E0;
  --rua:#F0793F; --pista:#9C7BFF; --feed:#F25595; --sala:#3CC0D0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.45;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ms{font-family:'Material Symbols Outlined';font-weight:300;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-feature-settings:'liga';display:inline-block;width:1em;overflow:hidden;flex:none}
.tn{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* ---------- estrutura ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding-block:20px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{padding:0 10px 18px;display:flex;flex-direction:column;gap:2px}
.brand b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink3)}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500;width:100%}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav[aria-current="page"]{background:var(--soft);color:var(--ink)}
.nav .badge{margin-left:auto}
.badge{background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;border-radius:10px;padding:1px 7px;font-family:var(--mono)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:12px}
.side-foot .row{display:flex;justify-content:space-between}
.main{min-width:0;padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.015em}
.topbar .sub{color:var(--ink3);font-size:13px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.stat-mini{display:flex;flex-direction:column;font-size:11px;color:var(--ink3)}
.stat-mini b{font-size:14px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- peças ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h h2{font-size:13px;font-weight:600;margin:0}
.lab{font-size:12px;color:var(--ink3)}
.big{font-size:24px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:2px}
.bar.lg{height:6px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--ink2);white-space:nowrap;font-weight:500}
.pill.hot{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ink);color:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-weight:500;font-size:13px;background:var(--panel)}
.btn:hover:not(:disabled){border-color:var(--ink3)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{color:var(--ink2);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%}
.rowi:first-child{border-top:0;padding-top:2px}
.rowi .grow{flex:1;min-width:0}
.rowi .t{font-weight:500}
.rowi .s{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.rowi:hover .t{text-decoration:underline;text-underline-offset:2px}
.ico{width:32px;height:32px;border-radius:8px;background:var(--soft);display:grid;place-items:center;color:var(--ink2);flex:none}
.ico.hot{background:var(--accent-soft);color:var(--accent)}
.warn .ms{color:var(--accent)}
.warn{font-size:12.5px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}
.empty{color:var(--ink3);font-size:13px;padding:6px 0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:12px;color:#fff;flex:none}

/* ---------- agenda ---------- */
.slot{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.slot.locked{border-color:var(--line2);background:linear-gradient(var(--panel),var(--panel)) padding-box}
.slot-h{display:flex;justify-content:space-between;align-items:baseline}
.slot-h b{font-weight:600;font-size:13px}
.acts{display:flex;flex-direction:column;gap:2px}
.act{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;width:100%}
.act:hover:not(:disabled){background:var(--soft)}
.act:disabled{opacity:.45;cursor:default}
.act b{font-weight:500;font-size:13.5px;display:block}
.act small{color:var(--ink3);font-size:12px}
.opt{display:flex;flex-direction:column;gap:2px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%}
.opt:hover:not(:disabled){border-color:var(--ink3)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt b{font-weight:500}
.opt span{font-size:12px;color:var(--ink2)}
.opts{display:flex;flex-direction:column;gap:6px}
.idea{font-size:13.5px;color:var(--ink);padding:10px 12px;background:var(--soft);border-radius:8px}
.chosen{display:flex;gap:10px;align-items:flex-start}
.chosen .t{font-weight:500}
.chosen .s{font-size:12.5px;color:var(--ink2)}
.costs{display:flex;gap:10px;font-family:var(--mono);font-size:12px;flex-wrap:wrap}
.confirm-box{background:var(--soft);border-radius:8px;padding:10px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0}
.line span:last-child{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.line.total{border-top:1px solid var(--line);padding-top:9px;margin-top:3px;font-weight:600}

/* ---------- celular ---------- */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100dvh - 120px);min-height:460px}
.clist{border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.clist-h{padding:14px 16px 10px;font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.citem{display:flex;gap:11px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);width:100%}
.citem:hover{background:var(--soft)}
.citem[aria-current="true"]{background:var(--soft)}
.citem .grow{flex:1;min-width:0}
.citem .n{font-weight:500;display:flex;justify-content:space-between;gap:6px}
.citem .p{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem.unread .p{color:var(--ink);font-weight:500}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.thread-h{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid var(--line)}
.thread-h .n{font-weight:600}
.thread-h .s{font-size:12px;color:var(--ink3)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.sep{align-self:center;font-size:11px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin:8px 0}
.b{max-width:min(78%,520px);padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.45;background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-top-left-radius:4px}
.b.me{align-self:flex-end;background:var(--me);color:var(--on-me);border-color:transparent;border-radius:12px;border-top-right-radius:4px}
.b.ghost{background:transparent;border:1px dashed var(--line2);color:var(--ink3);font-style:italic}
.b small{display:block;font-size:11px;color:var(--ink3);margin-top:3px}
.reply{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.reply .lab{display:flex;justify-content:space-between}
.qr{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;width:100%}
.qr:hover:not(:disabled){border-color:var(--ink);background:var(--soft)}
.qr:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.qr span{font-size:12px;color:var(--ink2);font-family:var(--mono)}
.backbtn{display:none}

/* ---------- faixas ---------- */
.tlayout{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.titem{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%}
.titem:last-child{border-bottom:0}
.titem[aria-current="true"]{background:var(--soft)}
.titem:hover{background:var(--soft)}
.titem .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.titem .top b{font-weight:500}
.attrs{display:grid;grid-template-columns:96px 1fr 30px;gap:9px 12px;align-items:center;font-size:13px}
.attrs em{font-style:normal;text-align:right;font-family:var(--mono);font-size:12px}
.apelo{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.apelo i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.tname{font-size:20px;font-weight:600;letter-spacing:-.01em;display:inline-flex;gap:6px;align-items:center}
.tname .ms{font-size:16px;color:var(--ink3)}
.tname-in{font:inherit;font-size:20px;font-weight:600;border:1px solid var(--line2);border-radius:8px;padding:4px 8px;background:var(--bg);color:var(--ink);width:100%}

/* ---------- público / contatos ---------- */
.segrow{display:grid;grid-template-columns:64px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.segrow em{font-style:normal;text-align:right;font-family:var(--mono);font-size:12px}
.relbar{height:6px;background:var(--soft);border-radius:3px;position:relative}
.relbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.relbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
svg text{font-family:var(--mono);font-size:10px;fill:var(--ink3)}
.chart{width:100%;height:auto;display:block}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,10,12,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;padding:max(28px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:14px;max-width:640px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:22px;font-weight:600;margin:0;letter-spacing:-.015em;text-wrap:balance}
.sheet p{margin:0}
.eyebrow{font-size:12px;color:var(--ink3);font-weight:500}
.res{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.res b.t{font-size:12px;color:var(--ink3);font-weight:500}
.res p{font-size:14px}
.deltas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.delta{background:var(--soft);border-radius:8px;padding:10px 12px}
.delta span{font-size:11.5px;color:var(--ink3);display:block}
.delta b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.origins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.origin{border:1px solid var(--line2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px}
.origin[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.origin b{font-weight:600}
.origin span{font-size:12.5px;color:var(--ink2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--ink3);font-weight:500}
.field input{font:inherit;font-size:18px;font-weight:500;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--ink)}

/* ---------- telas menores ---------- */
@media (max-width:1000px){
  .grid2,.tlayout{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:0}
  .brand,.side-foot{display:none}
  .nav{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;justify-content:center;align-items:center;position:relative}
  .nav .badge{position:absolute;top:0;right:calc(50% - 22px);margin:0;font-size:10px;padding:0 5px}
  .main{padding-bottom:96px}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .people{grid-template-columns:minmax(0,1fr)}
  .chat{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 190px)}
  .chat[data-open="1"] .clist{display:none}
  .chat[data-open="0"] .thread{display:none}
  .backbtn{display:inline-flex}
  .topbar .right .stat-mini{display:none}
  .origins,.deltas{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){.tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.big{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}}
/* Repertório: controles grandes e listas que cabem no celular. */
.setrow{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.setbuttons{display:flex;gap:8px;flex-wrap:wrap}.setbuttons .btn{min-height:38px}
.setrow strong{overflow-wrap:anywhere}.setlist{display:flex;flex-direction:column;gap:10px}
.setscroll{max-height:42dvh;overflow-y:auto}.setpick{border:2px solid var(--accent)}

/* Plei keeps its own dark palette inside the same career interface. */
.plei{--bg:#111614;--panel:#1b221e;--soft:#252e28;--ink:#f2f5f2;--ink2:#bac6bd;--ink3:#a0afa4;--line:#344038;--line2:#526358;--accent:#7ce0ad;background:var(--bg);color:var(--ink);padding:24px;border-radius:14px;display:flex;flex-direction:column;gap:20px;min-width:0}

.plei-hero{display:flex;gap:22px;align-items:center;min-width:0}.plei-hero>div{min-width:0;overflow-wrap:anywhere}.cover{width:150px;height:150px;border-radius:7px;flex:none;display:block}.cover.small{width:44px;height:44px;border-radius:4px}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const brl=n=>(n<0?'−':'')+'R$ '+Math.abs(Math.round(n)).toLocaleString('pt-BR');

const getT=id=>S.tracks.find(t=>t.id===id);
const norm=o=>{const r={};let s=0;SEGS.forEach(k=>{r[k]=Math.max(0,(o&&o[k])||0);s+=r[k]});SEGS.forEach(k=>r[k]=s?r[k]/s:.25);return r};
const mix=(a,b,w)=>{const na=norm(a),nb=norm(b),r={};SEGS.forEach(k=>r[k]=na[k]*(1-w)+nb[k]*w);return r};
const share=(t,seg)=>norm(t.apelo)[seg];
function rel(w,n){S.rel[w]=clamp(S.rel[w]+n,-100,100)}
function rep(s,n){S.rep[s]=clamp(S.rep[s]+n,0,100)}
function est(seg,n){S.estilo[seg]=Math.max(0,S.estilo[seg]+n)}
function money(n){S.grana+=n}
function sched(id,off,data){S.scheduled.push({week:S.week+off,id,data:data||{}})}
function addReach(n,dist,t,flags){S.wk.reach.push({n,dist:dist||null,tid:t?t.id:null,bot:!!(flags&&flags.bot)})}
function avgId(){const l=S.tracks.filter(t=>t.lancada&&!t.cover);return l.length?l.reduce((s,t)=>s+t.identidade,0)/l.length:45}
function finished(){return S.tracks.filter(t=>!t.cover&&t.letra>=100)}
function bestReleased(){const l=S.tracks.filter(t=>t.lancada);if(!l.length)return null;return l.slice().sort((a,b)=>b.semanaLanc-a.semanaLanc)[0]}
function musicAvg(){const h=S.history.slice(-6);if(!h.length)return 0;return h.reduce((s,x)=>s+x.music,0)/6}

function newTrack(nome){
  const t={id:'t'+(S.nextId++),nome,letra:0,sess:0,producao:0,identidade:30,gancho:20,profundidade:20,palco:20,
    apelo:{rua:1,pista:1,feed:1,sala:1},capa:false,capaPaga:false,lancada:false,semanaLanc:null,lancar:false,alcance:0,ouvintes:0,
    plays:0,playHistory:[],releaseWeek:null,hype:0,prazo:null,typeBeat:false,beatBigode:false,cru:false,feat:null,indireta:false,mae:false};
  S.tracks.push(t);return t;
}
function rapQuality(t,seg){
  const pr=t.producao,i=t.identidade,g=t.gancho,p=t.profundidade,v=t.palco;let q;
  if(seg==='rua')q=.45*i+.35*p+.2*v;
  else if(seg==='pista')q=.45*pr+.35*g+.2*v;
  else if(seg==='feed')q=.55*g+.25*pr+.2*i;
  else q=.55*p+.3*i+.15*pr;
  q/=100; if(t.cru)q*=.8; return clamp(q,.05,1);
}
function fixT(t){['identidade','gancho','profundidade','palco','producao'].forEach(k=>t[k]=clamp(Math.round(t[k]),0,100));t.letra=clamp(Math.round(t.letra),0,100)}
function stageOf(t){
  if(t.lancada)return{l:'Lançada · sem. '+t.semanaLanc,c:'live'};
  if(t.lancar)return{l:'Sai nesta sexta',c:'ready'};
  if(t.letra<100)return{l:'Letra '+t.letra+'%',c:''};
  if(t.sess<1)return{l:'Letra pronta · falta gravar',c:''};
  return{l:'Pronta pra lançar',c:'ready'};
}

livia_nobre:{from:'livia',once:true,weight:5,

viral_trecho:{from:'feed',

cobranca:{from:'feed',

rafa_indireta:{from:'rafa',once:true,weight:3,

kaka_trend:{from:'kaka',once:true,weight:4,

function logChat(k,me,txt,ghost){if(!S.chats)S.chats={};(S.chats[k]=S.chats[k]||[]).push({w:S.week,me,txt,ghost:!!ghost,n:S.nextId++})}
function senderOf(m){const e=EV[m.id];const k=e.fromFn?e.fromFn(m.data):e.from;return k}
function senderInfo(k){if(GENTE[k])return{nome:GENTE[k].nome,sub:GENTE[k].papel,cor:GENTE[k].cor,ini:GENTE[k].nome.replace('Seu ','').slice(0,2).toUpperCase()};return OUTROS[k]||OUTROS.cena}

function buildInbox(){
  S.inbox=[];
  const forced=S.scheduled.filter(x=>x.week===S.week);S.scheduled=S.scheduled.filter(x=>x.week!==S.week);
  (FORCED[S.week]||[]).forEach(id=>{if(!S.seen[id])forced.unshift({id,data:{}})});
  // prazo de hype estourado
  S.tracks.forEach(t=>{if(t.prazo&&!t.lancada&&S.week>t.prazo){forced.push({id:'cobranca',data:{tid:t.id}});t.prazo=null;t.hype=0}});
  if(S.clt&&S.faltas>=2){forced.push({id:'clt_demissao',data:{}});S.faltas=0}
  forced.push(...worldInbox());
  const list=[];
  forced.forEach(f=>{if(!list.some(x=>x.id===f.id&&x.data?.tid===f.data?.tid))list.push(f)});
  const n=Math.max(0,Math.min(2,4-list.length));
  const cands=Object.entries(EV).filter(([id,e])=>e.weight&&!list.some(x=>x.id===id)&&(!['taina_capa','scene_cover'].includes(id)||!list.some(x=>x.id==='campaign_capa'))&&!(e.once&&S.seen[id])&&!(e.cooldown&&S.seen[id]&&S.week-S.seen[id]<e.cooldown)&&(!e.cond||e.cond()));
  for(let k=0;k<n&&cands.length;k++){
    const tot=cands.reduce((s,[,e])=>s+e.weight,0);let r=Math.random()*tot,i=0;
    for(;i<cands.length;i++){r-=cands[i][1].weight;if(r<=0)break}
    i=Math.min(i,cands.length-1);const [id,e]=cands.splice(i,1)[0];
    if(Math.random()<.85||k===0)list.push({id,data:{}});
  }
  list.forEach(m=>{
    const e=EV[m.id];if(!e)return;
    if(e.mkData&&!Object.keys(m.data).length)m.data=e.mkData();
    S.seen[m.id]=S.week;
    if(e.onArrive)e.onArrive(m.data);
    S.inbox.push({uid:'m'+(S.nextId++),id:m.id,data:m.data,ans:null,reply:null,myText:null});
    logChat(senderOf(m),false,e.text(m.data));
  });
}

/* ---------- compromissos ---------- */
function freeSlots(){return[0,1,2].filter(i=>!S.plan[i]||!S.plan[i].locked)}
function placeCommit(c){
  let i=c.slot;
  if(S.plan[i]&&S.plan[i].locked){if(c.type==='tocar')return false;const f=freeSlots();if(!f.length)return false;i=f.sort((a,b)=>Math.abs(a-c.slot)-Math.abs(b-c.slot))[0]}
  S.plan[i]={type:c.type,opt:c.opt||null,label:c.label,data:JSON.parse(JSON.stringify(c.data||{})),locked:true,pen:c.pen||null,forced:!!c.forced,tid:null};
  if(UI.pick&&UI.pick.slot===i)UI.pick=null;
  return true;
}
function commitLater(c){S.commits.push(Object.assign({},c,{data:JSON.parse(JSON.stringify(c.data||{})),week:S.week+c.off,cid:'c'+(S.nextId++)}))}
function applyPen(pen){if(!pen)return;if(pen.roda){S.residency.misses++;if(S.residency.misses>=2){S.residency.active=false;logChat(PACK.producer,false,'Precisei chamar outro grupo para os domingos. Duas faltas no acordo não deram.')}}if(pen.rel)Object.entries(pen.rel).forEach(([k,v])=>rel(k,v));if(pen.rep)Object.entries(pen.rep).forEach(([k,v])=>k&&k!=='null'&&rep(k,v))}

function answer(uid,idx,auto){
  const m=S.inbox.find(x=>x.uid===uid);if(!m||m.ans!==null)return;
  const e=EV[m.id];const ch=e.choices(m.data)[idx];if(!ch)return;
  if(!auto){
    if(ch.need&&ch.need())return;
    if(ch.commit&&commitConflict(ch.commit))return;
    if(ch.commit&&ch.commit.off===0&&!freeSlots().length)return;
  }
  if(ch.commit){if(ch.commit.off===0){if(!placeCommit(ch.commit))return}else commitLater(ch.commit)}
  const r=ch.fx?ch.fx(m.data):null;
  m.ans=idx;m.myText=ch.l;m.auto=!!auto;
  if(r){m.reply=typeof r==='string'?{who:senderOf(m),txt:r}:r}
  logChat(senderOf(m),true,auto?'(não respondeu)':ch.l,auto);
  if(m.reply)logChat(m.reply.who,false,m.reply.txt);
  save();
}

function efic(){return S.disp<15?.5:S.disp>=70?1.15:1}

      break}
    case 'clt':money(330);L(pick(['Conferiu nota fiscal de seringa a manhã inteira. Salário certo, cabeça longe.','Inventário de luva e gaze. Aproveitou o almoço pra escrever duas linhas no celular.','O supervisor elogiou sua organização. Você pensou na faixa o turno inteiro.']));break;

      if(o.beat&&!tr.beatBigode){tr.beatBigode=true;tr.identidade+=4}
      const bonus=(S.flags.inspirado?10:0);S.flags.inspirado=false;

      Object.entries(o.es||{}).forEach(([k,v])=>est(k,v));

  const id=(d.set||[])[i],t=getT(id);if(!t||used.has(id)||(!t.lancada&&!t.cover&&unreleased>=1))return null;

function repeatPenalty(d,ids){

function autoSet(d){
  const n=setSize(d),pool=S.tracks.filter(readyLive);let best=null,bestScore=-Infinity;
  const strength=(t,i)=>.5*t.palco+.5*liveFit(t,d)+(i===0||i===n-1?edgeScore(t,d,i===n-1)*.25:0);

      opts.sort((a,b)=>{
        const score=t=>strength(t,i)+(i===0&&pool[trial]===t?18:0);
        return score(b)-score(a);
      });
      const t=opts[0];if(!t)continue;
      if(i>0&&i<n-1&&freeScore(d)>=strength(t,i)+20)continue;

/* ---------- simulação semanal de público ---------- */
function rapSimWeek(rep_){
  const lines=[];
  // lançamentos
  S.tracks.forEach(t=>{if(t.lancar&&!t.lancada){
    t.lancada=true;t.lancar=false;t.semanaLanc=S.week;S.lastAtiv=S.week;
    let n=(420+S.fas*6+recTot()*.25)*(t.capa?(t.capaPaga?1.35:1.25):1)*(1+Math.min(t.hype,150)/100)*(S.deal?S.deal.mult:1)*(t.feat?1.3:1);
    if(t.prazo&&S.week<=t.prazo){n*=1.3;lines.push(`Você cumpriu o que prometeu. Quem cobrou "${t.nome}" foi ouvir no dia.`);rep('net',4)}
    t.prazo=null;t.hype=0;addReach(n,null,t);
    lines.push(`"${t.nome}" saiu na sexta.${t.capa?' A capa da Tainá chamou atenção nas plataformas.':''}${t.typeBeat?' Alguém comentou que o beat é o mesmo de outra música.':''}`);
    if(t.indireta){rel('je',-25);sched('je_indireta',1);lines.push('A barra com indireta não passou batido. A Jé ouviu.')}
    if(t.mae)sched('mae_musica',1);
  }});
  // descoberta orgânica dos lançados
  S.tracks.filter(t=>t.lancada&&t.semanaLanc<S.week).forEach(t=>{const w=S.week-t.semanaLanc;if(w<12){const n=(60+S.fas*1.5)*Math.pow(.6,w);if(n>8)addReach(n,null,t)}});
  // converte alcance
  let reach=0;const nr={rua:0,pista:0,feed:0,sala:0};
  S.wk.reach.forEach(e=>{const t=e.tid?getT(e.tid):null;const dist=norm(e.dist||(t?t.apelo:null));reach+=e.n;if(t)t.alcance+=e.n;
    SEGS.forEach(k=>{let q=t?qual(t,k):.45;if(e.bot)q*=.02;if(t&&!t.lancada)q*=.35;const r=e.n*dist[k]*CONV[k]*q;nr[k]+=r;if(t)t.ouvintes+=r})});
  const idF=avgId()/100;
  let fanG=SEGS.reduce((s,k)=>s+nr[k]*FANR[k],0)*idF+recTot()*.003*idF+S.wk.fansDirect;
  // rotatividade
  const inativo=S.week-S.lastAtiv>5;
  SEGS.forEach(k=>{S.rec[k]=S.rec[k]*(inativo?.9:.95)+nr[k]});
  S.fas=Math.max(0,S.fas*(inativo?.96:.99)+fanG);
  if(inativo&&S.week>6)lines.push('Faz tempo que você não lança nem toca. Ouvintes e fãs começaram a esfriar.');
  S.lastReach=reach;
  return{lines,reach,newRec:SEGS.reduce((s,k)=>s+nr[k],0)};
}

  S.plan.forEach((p,i)=>blocks.push(resolveSlot(i,p)));
  const extra=[];
  (S.missed||[]).forEach(c=>{applyPen(c.pen);extra.push(`Você não conseguiu encaixar "${c.label}". ${c.pen&&c.pen.txt?c.pen.txt:''}`)});
  const sim=simWeek();
  const weekCosts=settleTeam();
  const streams=recTot()*.035*(S.deal?(1-S.deal.share):1);
  money(streams);S.wk.music+=streams;
  money(-CUSTO_VIDA);
  S.disp=clamp(S.disp+12,0,100);S.preparo=clamp(S.preparo-8,0,100);
  if(S.disp<=3){S.flags.pifou=true}
  S.history.push({w:S.week,music:Math.round(S.wk.music),reach:Math.round(sim.reach),rec:Math.round(recTot()),fas:Math.round(S.fas),grana:Math.round(S.grana)});
  const avg=musicAvg();
  const notes=[...extra,...sim.lines,...weekCosts,...checkMilestones()];
  updatePlei();
  if(avg>=CUSTO_VIDA&&!S.flags.viveu&&S.history.length>=6){S.flags.viveu=S.week;notes.push('Pela primeira vez, na média de seis semanas, a música pagou as contas.')}
  if(S.flags.pifou)notes.push('Você terminou a semana zerado. O início da próxima vai ser pra recuperar, quer queira, quer não.');
  if(S.grana<0)notes.push(`Você fechou a semana no vermelho: ${brl(S.grana)}.`);
  const replies=S.inbox.filter(m=>m.reply).map(m=>m.reply);
  S.report={week:S.week,blocks,notes,replies,streams:Math.round(streams),music:Math.round(S.wk.music),
    d:{grana:S.grana-before.grana,disp:S.disp-before.disp,rec:recTot()-before.rec,fas:S.fas-before.fas,reach:sim.reach}};
  if(S.week>=MAX_WEEK||S.grana<-1000){S.ended=true;S.epilogo=epilogue()}
  save();render();
}
function nextWeek(){
  if(S.ended){S.report=null;save();render();return}
  S.report=null;S.week++;startWeek();render();

}

  if(S.flags.venceuBatalha)tr.push('Ganhou a Batalha do Farol pelo menos uma vez, e isso ninguém tira.');
  if(S.flags.venceuEdital)tr.push('Ganhou o edital Rimas da Cidade.');

/* ---------- pacotes de gênero: registro e carregamento ---------- */
const GENRE_PACKS=Object.create(null);
const PACK_SCHEMA=1;
function validateGenrePack(pack){
  if(!pack||pack.schema!==PACK_SCHEMA||!pack.id||!pack.name)throw new Error('Pacote de gênero inválido.');
  for(const key of ['audience','characters','contacts','scenes','venues','origins','ideas','events','forced','actions','shows','presentation']){
    if(!pack[key])throw new Error('Pacote incompleto: '+key);
  }
  if(!pack.origins[pack.defaultOrigin])throw new Error('Origem inicial ausente.');
  if(!Array.isArray(pack.ideas)||!pack.ideas.length)throw new Error('Situações de composição ausentes.');
  const people={...SHARED_GENTE,...pack.characters},contacts={...SHARED_OUTROS,...pack.contacts};
  const events={...SHARED_EVENTS,...pack.events};
  const ordered=(order,map,label)=>{
    if(!Array.isArray(order)||order.length!==Object.keys(map).length||new Set(order).size!==order.length||order.some(id=>!map[id]))throw new Error('Ordem inválida de '+label);
  };
  ordered(pack.characterOrder,people,'personagens');ordered(pack.contactOrder,contacts,'contatos');ordered(pack.eventOrder,events,'eventos');
  for(const e of Object.values(events)){
    if(typeof e.text!=='function'||typeof e.choices!=='function')throw new Error('Evento sem texto ou escolhas.');
    if(e.from&&!people[e.from]&&!contacts[e.from])throw new Error('Remetente de evento ausente.');
  }
  Object.values(pack.forced).flat().forEach(id=>{if(!events[id])throw new Error('Evento obrigatório ausente.');});
  for(const seg of SEGS){
    if(!pack.audience.segments[seg]||!Number.isFinite(pack.audience.conversion[seg])||!Number.isFinite(pack.audience.fanConversion[seg]))throw new Error('Público incompleto.');
  }
  for(const [id,venue] of Object.entries(pack.venues)){
    if(!Number.isInteger(pack.shows.sizes[id])||pack.shows.sizes[id]<2||venue.seg&&!pack.audience.segments[venue.seg]||venue.scene&&!pack.scenes[venue.scene])throw new Error('Casa de show inválida: '+id);
  }
  const hooks=[pack.createState,pack.audience.quality,pack.audience.simulateWeek,pack.actions.homeCap,pack.actions.costOf,pack.actions.slotTitle,pack.actions.resolveSlot,pack.shows.houseKey,pack.shows.distribution,pack.shows.edgeScore,pack.shows.freestyleScore,pack.shows.resolve,pack.epilogue,pack.presentation.weekHeadline,pack.presentation.houseAudience,pack.presentation.inviteAudience];
  if(hooks.some(fn=>typeof fn!=='function'))throw new Error('Regra de gênero ausente.');
  return pack;
}
function registerGenrePack(pack){
  validateGenrePack(pack);
  if(GENRE_PACKS[pack.id])throw new Error('Pacote já registrado: '+pack.id);
  GENRE_PACKS[pack.id]=pack;
}
function activateGenre(id){
  const pack=GENRE_PACKS[id];if(!pack)throw new Error('Este pacote de gênero não está disponível nesta versão.');
  // Validar antes de trocar qualquer referência evita um carregamento pela metade.
  validateGenrePack(pack);
  const ordered=(order,all)=>Object.fromEntries(order.map(key=>[key,all[key]]));
  PACK=pack;SEG=pack.audience.segments;CONV=pack.audience.conversion;FANR=pack.audience.fanConversion;
  SCENES=pack.scenes;VENUES=pack.venues;ORIGENS=pack.origins;IDEIAS=pack.ideas;
  GENTE=ordered(pack.characterOrder,{...SHARED_GENTE,...pack.characters});
  OUTROS=ordered(pack.contactOrder,{...SHARED_OUTROS,...pack.contacts});
  EV=ordered(pack.eventOrder,{...SHARED_EVENTS,...pack.events});FORCED=pack.forced;
  ACOES=pack.actions.catalog;OPTS=pack.actions.options;SET_SIZE=pack.shows.sizes;
  attachWorldContent();
  return pack;
}
function adoptCareer(state){
  if(!state||state.v!==1)throw new Error('Carreira incompatível.');
  // Saves antigos não possuem gênero: são sempre o Rap original.
  const id=state.genre===undefined?'rap':state.genre;
  const pack=GENRE_PACKS[id];if(!pack)throw new Error('Este pacote de gênero não está disponível nesta versão.');
  if(state.genreVersion!==undefined&&state.genreVersion>pack.version)throw new Error('Esta carreira precisa de uma versão mais recente do jogo.');
  activateGenre(id);
  state.genre=id;if(state.genreVersion===undefined)state.genreVersion=pack.version;
  ensureModernState(state);
  return state;
}
function newGame(name,origin,genre='rap'){
  const pack=GENRE_PACKS[genre];if(!pack)throw new Error('Gênero indisponível.');
  const selected=origin||pack.defaultOrigin;
  if(!pack.origins[selected])throw new Error('Origem indisponível para este gênero.');
  activateGenre(genre);S=pack.createState(name,selected);
  S.genre=pack.id;S.genreVersion=pack.version;UI.packError=null;ensureModernState(S);startWeek();
}

    }
    o+=`</div>`;
  });

  const fut=S.commits.slice().sort((a,b)=>a.week-b.week);
  o+=`<div class="grid2"><div class="card"><div class="card-h"><h2>Previsão da semana</h2><span class="lab">antes de fechar</span></div><div>
      ${lines}

      <div class="line"><span>Custo de vida</span><span class="neg">−${brl(CUSTO_VIDA)}</span></div>
      ${rel.length?`<div class="line"><span>Lançamento: ${rel.map(t=>'"'+esc(t.nome)+'"').join(', ')}</span><span>sexta</span></div>`:''}
      <div class="line total"><span>Grana no domingo</span><span class="${f.g<0?'neg':''}">${brl(f.g)}</span></div>
      <div class="line"><span>Disposição no domingo</span><span>${Math.round(f.d)}</span></div></div>

      ${S.clt?`<div class="rowi"><span class="ico">${ms('badge')}</span><span class="grow"><span class="t">Almoxarifado do hospital</span><span class="s" style="display:block">Todo início de semana · +R$ 330</span>${UI.quit?`<div class="confirm-box" style="margin-top:6px"><span>Pedir demissão libera o período, mas some a grana certa. Sua mãe vai sentir.</span><div style="display:flex;gap:8px"><button class="btn primary" data-act="quitYes">Pedir demissão</button><button class="btn" data-act="quitNo">Ficar</button></div></div>`:''}</span>${UI.quit?'':`<button class="link" data-act="quit">sair</button>`}</div>`:''}

function penText(pen){if(!pen)return'Sem consequência.';const a=[];if(pen.rel)Object.entries(pen.rel).forEach(([k,v])=>a.push(`${GENTE[k].nome} ${v}`));if(pen.rep)Object.entries(pen.rep).forEach(([k,v])=>SCENES[k]&&a.push(`moral no ${SCENES[k]} ${v}`));return(pen.txt?pen.txt+' ':'')+'Consequência: '+a.join(', ')+'.'}

function sparkSVG(vals,label,color,ref){
  const W=480,H=120,pl=40,pr=8,pt=12,pb=20;
  const max=Math.max(ref||0,...vals,1);const n=vals.length;
  const x=i=>pl+(n<=1?0:(W-pl-pr)*i/(n-1)),y=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const area=n>1?`<polygon points="${x(0).toFixed(1)},${H-pb} ${pts} ${x(n-1).toFixed(1)},${H-pb}" fill="${color}" opacity=".1"/>`:'';
  const refL=ref?`<line x1="${pl}" x2="${W-pr}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W-pr}" y="${y(ref)-4}" text-anchor="end">custo de vida</text>`:'';
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/><line x1="${pl}" x2="${W-pr}" y1="${pt}" y2="${pt}" stroke="var(--line)" stroke-dasharray="2 3"/>
    <text x="${pl-6}" y="${pt+3}" text-anchor="end">${fmt(max)}</text><text x="${pl-6}" y="${H-pb+3}" text-anchor="end">0</text>
    <text x="${pl}" y="${H-5}">sem. ${S.history[0]?S.history[0].w:1}</text><text x="${W-pr}" y="${H-5}" text-anchor="end">sem. ${S.history.at(-1)?S.history.at(-1).w:1}</text>
    ${refL}${area}${n>1?`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>`:''}${n?`<circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="3.5" fill="${color}"/>`:''}</svg>`;
}

function renderModal(){
  const m=document.getElementById('modal');
  if(UI.packError){m.innerHTML=`<div class="overlay"><div class="sheet"><h2>Não foi possível abrir esta carreira</h2><p>${esc(UI.packError)}</p><p class="muted">O progresso salvo foi mantido. Abra a versão do jogo que contém o pacote desta carreira.</p><button class="btn" data-act="newgame">Apagar esta carreira e começar outra</button></div></div>`;return}
  if(!S){m.innerHTML=startHTML();return}
  if(UI.setRef){m.innerHTML=setEditorHTML();return}
  if(UI.showWarn){m.innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-label="Revisar repertório"><h2>Tem show sem repertório montado</h2><p>Os espaços vazios viram freestyle. Você pode revisar antes ou seguir com o improviso.</p>${S.plan.map((p,i)=>p&&p.type==='tocar'&&!p.data.set?`<button class="btn" data-act="setOpen" data-i="${i}">Montar: ${esc(VENUES[p.data.venue].nome)}</button>`:'').join('')}<button class="btn primary" data-act="showProceed">Seguir com freestyle</button><button class="btn" data-act="showBack">Voltar para a agenda</button></div></div>`;return}
  if(UI.menu){m.innerHTML=`<div class="overlay"><div class="sheet"><h2>Opções do jogo</h2><p class="muted">O jogo salva sozinho neste navegador. Começar outra carreira apaga esta.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="menuClose">Voltar pro jogo</button><button class="btn accent" data-act="newgame">Começar outra carreira</button></div></div></div>`;return}
  if(S.report){m.innerHTML=reportHTML();return}
  if(S.ended&&S.epilogo){m.innerHTML=endHTML();return}
  if(UI.confirmWarn){const n=pendingCount();m.innerHTML=`<div class="overlay"><div class="sheet"><span class="eyebrow">Antes de fechar</span><h2>${n} mensagem(ns) sem resposta</h2><p class="muted">Quem ficar no vácuo vai lembrar disso. Às vezes é exatamente o que você quer.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="confirmYes">Fechar assim mesmo</button><button class="btn" data-act="confirmNo">Ir pro celular</button></div></div></div>`;return}

}

function reportHTML(){
  const r=S.report;const d=r.d;
  const dl=(n,v,f)=>`<div class="delta"><span>${n}</span><b class="${v>0?'pos':v<0?'neg':''}">${f(v)}</b></div>`;
  return`<div class="overlay"><div class="sheet" role="dialog" aria-label="Resultado da semana">
    <span class="eyebrow">Semana ${r.week} · resultado</span>
    <h2>${esc(weekHeadline(r))}</h2>
    <div class="deltas">${dl('Grana',d.grana,v=>sgn(v,x=>brl(x)))}${dl('Disposição',d.disp,v=>sgn(v))}${dl('Alcance',d.reach,v=>fmt(v))}${dl('Ouvintes recorrentes',d.rec,v=>sgn(v))}${dl('Fãs',d.fas,v=>sgn(v))}${dl('Música rendeu',r.music,v=>brl(v))}</div>
    <div>${r.blocks.map(b=>`<div class="res"><b class="t">${esc(b.t)}</b>${b.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`).join('')}
    ${r.notes.length?`<div class="res"><b class="t">Na cena</b>${r.notes.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`:''}
    ${r.replies.length?`<div class="res"><b class="t">No celular</b>${r.replies.map(x=>`<p><b style="font-weight:600">${esc(senderInfo(x.who).nome)}:</b> ${esc(x.txt)}</p>`).join('')}</div>`:''}</div>
    <span class="lab">Inclui ${brl(r.streams)} de streaming e ${brl(CUSTO_VIDA)} de custo de vida.</span>
    <button class="btn primary" data-act="next" style="align-self:flex-start;padding:10px 18px">${S.ended?'Ver como terminou':'Começar semana '+(r.week+1)} ${ms('arrow_forward')}</button>
  </div></div>`;
}
function rapWeekHeadline(r){
  if(r.d.reach>15000)return'Seu nome rodou longe essa semana';
  if(r.blocks.some(b=>b.lines.some(l=>l.startsWith('Você venceu a Batalha'))))return'Campeão do Farol';
  if(r.blocks.some(b=>b.lines.some(l=>l.startsWith('Show:'))))return'Noite de palco';
  if(r.d.fas>=8)return'Gente nova chegando pra ficar';
  if(S.grana<0)return'Semana no vermelho';
  if(r.d.disp<-20)return'Semana puxada';
  return pick(['Mais uma semana de corre','Passo a passo','A semana passou rápido']);
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;const i=+b.dataset.i;
  switch(a){
    case 'extra':handleExtra(b.dataset);break;
    case 'setOpen':UI.setRef=b.dataset.cid?{cid:b.dataset.cid}:{slot:i};UI.setIndex=null;UI.showWarn=false;break;
    case 'setDone':{const p=activeShow();if(p&&!p.data.set)p.data.set=Array(setSize(p.data)).fill(null);UI.setRef=null;UI.setIndex=null;break}
    case 'setPick':UI.setIndex=i;break;
    case 'setPickClose':UI.setIndex=null;break;
    case 'setAuto':{const p=activeShow();if(p)autoSet(p.data);UI.setIndex=null;break}
    case 'setEmpty':{const p=activeShow();if(p){p.data.set=readSet(p.data);p.data.set[i]=null}UI.setIndex=null;break}
    case 'setMove':{const p=activeShow(),j=i+(+b.dataset.dir);if(p&&j>=0&&j<setSize(p.data)){const ids=readSet(p.data);[ids[i],ids[j]]=[ids[j],ids[i]];p.data.set=ids}UI.setIndex=null;break}
    case 'setTrack':{const p=activeShow(),idx=UI.setIndex;if(p&&Number.isInteger(idx)&&idx>=0&&idx<setSize(p.data)){const ids=readSet(p.data),id=b.dataset.tid||null,t=getT(id);if(!id||(t&&!ids.some((x,k)=>k!==idx&&x===id)&&(t.lancada||t.cover||!ids.some((x,k)=>k!==idx&&getT(x)&&!getT(x).lancada&&!getT(x).cover)))){ids[idx]=id;p.data.set=ids;UI.setIndex=null}}break}
    case 'showBack':UI.showWarn=false;UI.view='agenda';break;
    case 'showProceed':UI.showWarn=false;if(pendingCount()){UI.confirmWarn=true;break}confirmWeek();return;
    case 'genre':{const ni=document.getElementById('nameIn');if(ni)UI.startName=ni.value;UI.startGenre=b.dataset.k;activateGenre(UI.startGenre);UI.startOrigin=PACK.defaultOrigin;break}
    case 'origin':{ UI.startOrigin=b.dataset.k;const ni=document.getElementById('nameIn');if(ni)UI.startName=ni.value;break}
    case 'start':{const ni=document.getElementById('nameIn');const nm=(ni&&ni.value.trim())||'Kairo';UI.startName='';newGame(nm,UI.startOrigin,UI.startGenre||'rap');if(S.genre==='indie'&&UI.startFormation)S.formation=UI.startFormation;UI.view='cel';UI.chat=PACK.mentor||'je';UI.chatOpen=true;break}
    case 'menu':UI.menu=true;break;
    case 'menuClose':UI.menu=false;break;
    case 'newgame':try{localStorage.removeItem(SAVE_KEY)}catch(e){}S=null;UI.menu=false;UI.packError=null;UI.startGenre='rap';UI.startFormation=null;activateGenre('rap');UI.startOrigin=PACK.defaultOrigin;UI.setRef=null;UI.showWarn=false;UI.confirmWarn=false;break;
    case 'closeEnd':S.epilogo=null;break;
    case 'view':UI.view=b.dataset.k;UI.pick=null;if(UI.view==='cel')UI.chatOpen=false;window.scrollTo({top:0});break;
    case 'openChat':UI.view='cel';UI.chat=b.dataset.k;UI.chatOpen=true;break;
    case 'closeChat':UI.chatOpen=false;break;
    case 'openTrack':UI.view='faixas';UI.track=b.dataset.tid;UI.renaming=null;break;
    case 'goSlot':UI.view='agenda';if(!S.plan[i])UI.pick=null;break;
    case 'ans':answer(b.dataset.uid,+b.dataset.i);break;
    case 'pick':UI.pick={slot:i,type:b.dataset.type,tid:null,opt:null,pi:null};break;
    case 'back':UI.pick=null;break;
    case 'pTrack':{const pk=UI.pick;pk.tid=b.dataset.tid;
      if(pk.type==='compor'){const el=IDEIAS.map((x,k)=>k).filter(k=>!IDEIAS[k].cond||IDEIAS[k].cond());pk.pi=pick(el)}
      if(pk.type==='conteudo'){if(S.genre==='funk')pk.shareStep=true;else setPlan(pk.slot,{type:'conteudo',opt:'trecho',tid:pk.tid})}
      break}
    case 'pIdea':{const pk=UI.pick;setPlan(pk.slot,{type:'compor',tid:pk.tid,pi:pk.pi,oi:+b.dataset.oi});break}
    case 'pOpt':{const pk=UI.pick;const id=b.dataset.id;if(S.genre==='funk'&&pk.type==='gravar'&&!pk.version){pk.opt=id;pk.versionStep=true;break}if(S.genre==='funk'&&pk.type==='conteudo'&&id==='trecho'){pk.opt=id;break}if(pk.type==='conteudo'&&id==='trecho'){pk.opt='trecho';break}setPlan(pk.slot,{type:pk.type,opt:id,tid:pk.tid||null});break}
    case 'clear':S.plan[i]=null;UI.pick=null;break;
    case 'unlock':UI.confirmUnlock=i;break;
    case 'unlockNo':UI.confirmUnlock=null;break;
    case 'unlockYes':{const p=S.plan[i];if(p.type==='clt'){S.faltas++;rel('mae',-4)}else applyPen(p.pen);S.plan[i]=null;UI.confirmUnlock=null;break}
    case 'cancelC':UI.cancelCommit=b.dataset.cid;break;
    case 'cancelNo':UI.cancelCommit=null;break;
    case 'cancelYes':{const c=S.commits.find(x=>x.cid===b.dataset.cid);if(c){applyPen(c.pen);S.commits=S.commits.filter(x=>x!==c)}UI.cancelCommit=null;break}
    case 'quit':UI.quit=true;break;
    case 'quitNo':UI.quit=false;break;
    case 'quitYes':S.clt=false;rel('mae',-12);S.plan=S.plan.map(p=>p&&p.type==='clt'?null:p);UI.quit=false;break;
    case 'release':{const t=getT(b.dataset.tid);if(t){t.lancar=!t.lancar;t.releaseWeek=null}break}
    case 'rename':UI.renaming=b.dataset.tid;break;
    case 'confirm':if(S.plan.some(p=>p&&p.type==='tocar'&&!p.data.set)){UI.showWarn=true;break}if(pendingCount()){UI.confirmWarn=true;break}confirmWeek();return;
    case 'confirmYes':UI.confirmWarn=false;confirmWeek();return;
    case 'confirmNo':UI.confirmWarn=false;UI.view='cel';UI.chat=null;UI.chatOpen=false;{const m=S.inbox.find(x=>x.ans===null);if(m){UI.chat=senderOf(m);UI.chatOpen=true}}break;
    case 'next':nextWeek();return;
  }
  if(S)save();render();
});
function setPlan(slot,p){S.plan[slot]=Object.assign({locked:false,data:{},label:null},p);UI.pick=null;guidePlan(p)}
document.addEventListener('keydown',ev=>{

  if(ev.target.id==='nameIn'&&ev.key==='Enter')document.querySelector('[data-act="start"]').click();
});
document.addEventListener('focusout',ev=>{if(ev.target.id==='renameIn')commitRename(ev.target)});

function showOfferForCurrent(fee){const v=genreId()==='rap'?'galpao':Object.keys(VENUES)[0];return{off:1,slot:2,type:'tocar',label:VENUES[v].nome,data:{venue:v,cache:fee,band:genreId()==='pagode'?110:0,travel:genreId()==='funk'?25:0},pen:{rel:{[PACK.producer]:-10},txt:'A data ficou sem a apresentação combinada.'}}}
function updatePlei(){
 if(S.plei.weeks.some(w=>w.week===S.week))return;
 const tracks=S.tracks.filter(t=>t.lancada&&!t.cover),totalWeight=tracks.reduce((n,t)=>n+Math.max(t.ouvintes,1),0)||1,rt=recTot();let sum=0;
 for(const t of tracks){const repeat=rt*Math.max(t.ouvintes,1)/totalWeight,discovery=(S.weekTrackReach?.[t.id]||0)*.08;const plays=Math.max(0,Math.round(repeat*4+discovery));t.playHistory.push({week:S.week,plays});t.plays+=plays;sum+=plays;}
 const last=S.history.slice(-4),peak=Math.max(rt,...last.map(w=>w.rec)),discovery=last.slice(0,-1).reduce((n,w)=>n+w.rec*.08,0);S.plei.monthly=Math.round(peak+discovery);
 for(const a of S.city){const release=S.week>=a.nextRelease;const pack=GENRE_PACKS[a.genre],conv=Object.values(pack.audience.conversion).reduce((n,v)=>n+v,0)/4;
 const base=release?(420+a.fans*6+a.rec*.25):65+a.fans*1.3;
 a.rec=Math.max(0,a.rec*.95+base*conv*.65*a.growth*(.7+Math.random()*.6));a.fans=a.fans*.99+base*conv*.65*.07;
 if(release){const name=['Virada','Perto de Casa','Quinta Feira','Outra Parte','Sem Aviso'][a.releases.length%5];a.releases.push({week:S.week,name,plays:0});a.nextRelease=S.week+RI(3,6)}
 const plays=Math.round(a.rec*4+(release?base*.08:0));a.plays+=plays;a.history.push({week:S.week,rec:Math.round(a.rec),plays});if(a.releases.length)a.releases.at(-1).plays+=plays;
 }
 const table=rankRows();S.plei.previousRank=S.plei.rank;S.plei.rank=table.findIndex(x=>x.player)+1;S.plei.weeks.push({week:S.week,monthly:S.plei.monthly,plays:sum,rank:S.plei.rank});
 if(S.plei.previousRank&&S.plei.rank<S.plei.previousRank)logChat('plei',false,`Seu perfil subiu para o ${S.plei.rank}º lugar no Top Plei Rio.`);
}
function rankRows(){const rows=S.city.map(a=>{const last=a.history.slice(-4),rec=a.rec,monthly=Math.round(Math.max(rec,...last.map(w=>w.rec),0)+last.slice(0,-1).reduce((n,w)=>n+w.rec*.08,0));const prev=last.length>=2?last.at(-2).rec:rec;return{...a,monthly,delta:Math.round(rec-prev)}});rows.push({id:'player',name:S.name,genre:genreId(),monthly:S.plei.monthly||Math.round(recTot()),player:true,delta:0});return rows.sort((a,b)=>b.monthly-a.monthly||a.id.localeCompare(b.id))}
function pleiRetrospective(){const tracks=S.tracks.filter(t=>t.lancada&&!t.cover),top=tracks.slice().sort((a,b)=>b.plays-a.plays)[0],best=Math.min(...S.plei.weeks.map(w=>w.rank),S.plei.rank||13);return `Sua temporada na Plei: ${fmt(tracks.reduce((n,t)=>n+t.plays,0))} plays registrados, ${tracks.length} autoral(is) disponíveis e melhor posição ${best} no Top Rio.${top?' A mais ouvida foi "'+top.nome+'".':''}`}
function coverSVG(t,small=false){
 const seed=String(t.id||t.name||'').split('').reduce((n,c)=>((n*31+c.charCodeAt(0))>>>0),7),top=SEGS.slice().sort((a,b)=>(t.apelo?.[b]||0)-(t.apelo?.[a]||0))[0],h=({rua:24,pista:278,feed:335,sala:170})[top],sat=45+(t.gancho||20)*.35,shift=(seed%37)-18;
 const bg=`hsl(${h+shift} 35% 16%)`,fg=`hsl(${h+shift} ${sat}% 65%)`,alt=`hsl(${h+105} 55% 55%)`,r=12+(t.gancho||20)*.28,x=25+seed%45,y=30+(seed>>3)%40;
 return `<svg class="cover ${small?'small':''}" viewBox="0 0 120 120" role="img" aria-label="Capa de ${esc(t.nome||t.name||'faixa')}"><rect width="120" height="120" fill="${bg}"/><circle cx="${x}" cy="${y}" r="${r}" fill="${fg}"/><path d="M0 ${95-(t.palco||20)*.4} L120 ${20+(t.profundidade||20)*.5} L120 120 L0 120Z" fill="${alt}" opacity=".65"/>${t.capa?`<rect x="9" y="9" width="102" height="102" rx="2" fill="none" stroke="${fg}" stroke-width="1"/><path d="M14 88H106M14 92H78M14 96H92" stroke="${fg}" stroke-width="1"/><circle cx="90" cy="26" r="13" fill="none" stroke="${alt}" stroke-width="2"/>`:''}${t.capaPaga?'<path d="M18 18V44M18 18H44M102 102V76M102 102H76" fill="none" stroke="#fff" opacity=".65"/>':''}<text x="14" y="108" fill="#fff" style="font-family:var(--mono);font-size:7px;letter-spacing:1px">${esc((t.nome||t.name||'PORTO').slice(0,19).toUpperCase())}</text></svg>`;
}
function pleiChart(history){const W=560,H=145,p=30,values=history.map(w=>w.plays),max=Math.max(...values,1),x=i=>p+(W-2*p)*i/Math.max(1,values.length-1),y=v=>H-p-(H-2*p)*v/max;return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plays por semana"><path d="M${p} ${H-p}H${W-p}" stroke="#444"/>${values.length?`<polyline points="${values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="#7ce0ad" stroke-width="2"/>${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#7ce0ad"><title>Semana ${history[i].week}: ${fmt(v)} plays</title></circle>`).join('')}<text x="${p}" y="${H-5}">sem. ${history[0].week}</text><text x="${W-p}" y="${H-5}" text-anchor="end">sem. ${history.at(-1).week}</text>`:'<text x="30" y="75">O gráfico aparece após fechar uma semana.</text>'}</svg>`}

 else if(tab==='top')body=`<div class="card"><div class="card-h"><h2>Top Plei Rio</h2><span class="lab">Semana ${S.week} · ouvintes mensais</span></div>${rankRows().map((a,i)=>`<button class="plei-rank ${a.player?'you':''}" data-act="extra" data-op="pleiArtist" data-id="${a.id}"><span>${i+1}</span><span><b>${esc(a.name)}${a.player?' · você':''}</b><small>${esc(GENRE_PACKS[a.genre].name)}</small></span><span>${fmt(a.monthly)}<small>${a.player?(S.plei.previousRank?`posição anterior: ${S.plei.previousRank}`:'primeira medição'):`${sgn(a.delta)} recorrentes`}</small></span></button>`).join('')}</div><p class="lab">Os outros projetos lançam músicas e mudam de público ao longo da temporada. O ranking usa a mesma estimativa mensal para todos.</p>`;
 else if(tab==='playlists')body=`<div class="people">${PLAYLISTS.map(list=>{const entries=S.playlists.filter(p=>p.id===list.id&&p.until>=S.week&&getT(p.tid)?.lancada);return `<div class="card"><span class="lab">${list.kind==='editorial'?'CURADORIA PLEI':'PLAYLIST DE OUVINTE'}</span><h2>${esc(list.name)}</h2><p class="lab">${list.genre?GENRE_PACKS[list.genre].name:'Seleção de quem ouve'} · descoberta por tempo limitado</p>${entries.length?entries.map(p=>`<button class="link" data-act="extra" data-op="pleiTrack" data-id="${p.tid}">${esc(getT(p.tid).nome)} · até semana ${p.until}</button>`).join(''):'<span class="lab">Nenhuma música sua aqui nesta semana.</span>'}</div>`}).join('')}</div>`;
