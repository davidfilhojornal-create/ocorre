/* ---------- backup ---------- */
function xB64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function xUnB64(str){const s=atob(str);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b}
async function xGz(bytes,de){const cs=de?new DecompressionStream('gzip'):new CompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(cs);return new Uint8Array(await new Response(stream).arrayBuffer())}
function xBackupObj(){return{app:'o-corre',v:1,em:new Date().toISOString(),save:JSON.parse(JSON.stringify(S)),meta:xLS.get('ocorre-meta'),dicas:xLS.get('ocorre-dicas'),tutorial:xLS.get('ocorre-tutorial')}}
async function xBackupCode(){const raw=new TextEncoder().encode(JSON.stringify(xBackupObj()));if(typeof CompressionStream==='function'){try{return'OC1.'+xB64(await xGz(raw))}catch(e){}}return'OC0.'+xB64(raw)}
async function xReadCode(code){code=String(code||'').trim();if(code.startsWith('{'))return JSON.parse(code);const [h,body]=[code.slice(0,4),code.slice(4).replace(/\s+/g,'')];let bytes=xUnB64(body);if(h==='OC1.')bytes=await xGz(bytes,true);else if(h!=='OC0.')throw new Error('Esse código não é de uma carreira do O Corre.');return JSON.parse(new TextDecoder().decode(bytes))}
function xApplyBackup(o){
  if(!o||o.app!=='o-corre'||!o.save||o.save.v!==1)throw new Error('Esse arquivo não é um backup do O Corre.');
  const prev=xLS.get(SAVE_KEY);if(prev)xLS.set('ocorre-save-anterior',prev);
  xLS.set(SAVE_KEY,JSON.stringify(o.save));if(o.meta)xLS.set('ocorre-meta',o.meta);if(o.dicas)xLS.set('ocorre-dicas',o.dicas);if(o.tutorial)xLS.set('ocorre-tutorial',o.tutorial);
  location.reload();
}
function xDownload(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function xSlug(s){return String(s||'carreira').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'carreira'}

/* ---------- instalar ---------- */
let xInstallEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();xInstallEvt=e});
window.addEventListener('appinstalled',()=>{xInstallEvt=null;UI.xInstalled=true;if(S)render()});
function xStandalone(){try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}}
function xIOS(){return/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}

/* ---------- ranking ---------- */
function xRankHeaders(){return{apikey:XC.supabaseKey,'Content-Type':'application/json'}}
function xCid(){if(!S.xCid)S.xCid=(crypto.randomUUID?crypto.randomUUID():'c'+Date.now().toString(36)+Math.random().toString(36).slice(2));return S.xCid}
function xNick(){return xLS.get('ocorre-apelido','')}
function xRankRow(){return{id:xCid(),apelido:xNick().slice(0,24),artista:String(S.name||'').slice(0,24),genero:genreId(),ano:S.year||1,semana:S.week,fas:Math.round(S.fas),ouvintes:Math.round(recTot()),grana:Math.round(S.grana),final:S.ended&&S.epilogo?String(S.epilogo.titulo||'').slice(0,40):null,premios:(S.awards||[]).length,atualizado:new Date().toISOString()}}
async function xRankPush(){
  if(!XRANK||!xNick()||!S)return;
  try{await fetch(`${XC.supabaseUrl.replace(/\/$/,'')}/rest/v1/carreiras?on_conflict=id`,{method:'POST',headers:{...xRankHeaders(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(xRankRow())});UI.xRankAt=0}catch(e){}
}
async function xRankPull(force){
  if(!XRANK)return;if(!force&&UI.xRankAt&&Date.now()-UI.xRankAt<60000)return;UI.xRankAt=Date.now();
  try{const r=await fetch(`${XC.supabaseUrl.replace(/\/$/,'')}/rest/v1/carreiras?select=*&order=fas.desc&limit=40`,{headers:xRankHeaders()});if(!r.ok)throw new Error(r.status);UI.xRank=await r.json();UI.xRankErr=null}catch(e){UI.xRankErr='Não deu pra carregar o ranking agora.'}
  if(S&&UI.view==='janela')render();
}
function xRankHTML(){
  if(!XRANK)return'';
  if(UI.view==='janela')xRankPull();
  const me=S.xCid;const rows=(UI.xRank||[]);
  const join=!xNick()?`<div class="xr-join"><p>Entra no ranking pra seus amigos verem sua carreira. Só vai seu apelido, o nome do artista e os números do jogo.</p><div><input id="xNickIn" maxlength="24" placeholder="Seu apelido" value="${esc(UI.xNickDraft||'')}" aria-label="Seu apelido"><button class="btn primary" data-x11="nick">Entrar</button></div></div>`:'';
  return`<div class="xe-sec xr"><h3 class="xh">Ranking dos amigos</h3>${join}
    ${UI.xRankErr?`<span class="warn">${esc(UI.xRankErr)}</span>`:''}
    ${rows.length?`<div class="xr-list">${rows.map((r,i)=>`<div class="xr-row ${r.id===me?'me':''}"><span class="pos">${i+1}</span><span class="who"><b>${esc(r.artista)}</b><small>${esc(r.apelido||'')}, ${esc(GENRE_PACKS[r.genero]?GENRE_PACKS[r.genero].name:r.genero)}, ano ${r.ano} semana ${r.semana}${r.final?', '+esc(r.final):''}</small></span><span class="num"><b>${fmt(r.fas)}</b><small>fãs</small></span></div>`).join('')}</div>`:(!UI.xRankErr?'<span class="empty">Ninguém entrou no ranking ainda. Chama a galera.</span>':'')}
    ${xNick()?`<span class="lab">Você aparece como ${esc(xNick())}. Sua carreira atualiza toda vez que você fecha uma semana. <button class="link" data-x11="nickOut">sair do ranking</button></span>`:''}</div>`;
}
const xCity11=qCityHTML;qCityHTML=function(){return xRankHTML()+xCity11()};
const xConfirm11=confirmWeek;confirmWeek=function(){const go=S&&!S.report&&!S.ended;xConfirm11();if(go)xRankPush()};

/* ---------- feedback ---------- */
async function xSendFeedback(){
  const txt=(UI.xFb||'').trim();if(!txt)return;UI.xFbState='enviando';render();
  try{const r=await fetch(`${XC.supabaseUrl.replace(/\/$/,'')}/rest/v1/feedback`,{method:'POST',headers:{...xRankHeaders(),Prefer:'return=minimal'},body:JSON.stringify({apelido:xNick()||null,texto:txt.slice(0,2000),contexto:S?`${genreId()}, ano ${S.year||1}, semana ${S.week}, versão ${X_VERSION}, ${navigator.userAgent.slice(0,120)}`:`versão ${X_VERSION}`})});if(!r.ok)throw 0;UI.xFb='';UI.xFbState='ok'}catch(e){UI.xFbState='erro'}
  render();
}

/* ---------- menu de opções ---------- */
function xMenuHTML(){
  const inst=xStandalone()||UI.xInstalled?'<p class="ok">Você já tá jogando pelo app.</p>':xInstallEvt?`<button class="btn primary" data-x11="install">${qi('down')}Instalar o app</button>`:xIOS()?'<p>No iPhone: toca em Compartilhar, embaixo no Safari, e depois em <b>Adicionar à Tela de Início</b>.</p>':'<p>No menu do navegador, procura <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</p>';
  const fb=XRANK?`<textarea id="xFbIn" rows="3" maxlength="2000" placeholder="Conta o que aconteceu ou o que você queria ver no jogo">${esc(UI.xFb||'')}</textarea><div class="row"><button class="btn primary" data-x11="fbSend" ${UI.xFbState==='enviando'?'disabled':''}>${qi('send')}${UI.xFbState==='enviando'?'Enviando':'Enviar'}</button>${UI.xFbState==='ok'?'<span class="ok">Recebido, valeu!</span>':UI.xFbState==='erro'?'<span class="warn">Não foi agora. Tenta de novo daqui a pouco.</span>':''}</div>`
    :XC.feedbackUrl?`<a class="btn" href="${esc(XC.feedbackUrl)}" target="_blank" rel="noopener">${qi('send')}Abrir o formulário</a>`:'';
  return`<div class="overlay"><div class="sheet xmenu" role="dialog" aria-label="Opções do jogo">
    <div class="xmenu-h"><h2>Opções</h2><button class="xs-close" data-act="menuClose" aria-label="Fechar">${qi('x')}</button></div>
    <section><h3>Som</h3><button class="btn" data-x11="snd">${qi(SND.on?'snd':'sndoff')}${SND.on?'Ligado':'Desligado'}</button></section>
    <section><h3>Backup da carreira</h3><p>Guarda sua carreira fora do navegador. Serve pra não perder nada e pra continuar em outro aparelho.</p>
      <div class="row"><button class="btn" data-x11="bkDown">${qi('down')}Baixar arquivo</button><button class="btn" data-x11="bkCopy">${qi('copy')}Copiar código</button></div>
      <div class="row"><label class="btn" for="xBkFile">${qi('up')}Carregar arquivo</label><input type="file" id="xBkFile" accept=".json,application/json" hidden><button class="btn" data-x11="bkPaste">Colar código</button></div>
      ${UI.xBkPaste?`<textarea id="xBkCode" rows="3" placeholder="Cola o código aqui">${esc(UI.xBkCodeDraft||'')}</textarea><div class="row"><button class="btn primary" data-x11="bkLoad">Carregar essa carreira</button></div>`:''}
      ${UI.xBkMsg?`<p class="${UI.xBkMsgOk?'ok':'warn'}">${esc(UI.xBkMsg)}</p>`:''}
      <p class="lab">Carregar um backup troca a carreira atual neste aparelho.</p></section>
    <section><h3>Jogar como app</h3>${inst}<p class="lab">Instalado, ele abre em tela cheia e funciona sem internet.</p></section>
    ${fb?`<section><h3>Achou um bug ou tem uma ideia?</h3>${fb}</section>`:''}
    ${XRANK?`<section><h3>Ranking dos amigos</h3><p>${xNick()?`Você aparece como <b>${esc(xNick())}</b>.`:'Você ainda não entrou.'} O ranking fica na aba Cidade.</p></section>`:''}
    <section><h3>Card da temporada</h3><p>Uma imagem no formato de story com os números da sua carreira até agora.</p><button class="btn" data-x11="card">${qi('share')}Gerar card</button></section>
    <section class="danger"><h3>Começar outra carreira</h3>${UI.xNewAsk?`<p>Isso apaga a carreira atual deste aparelho. Baixa um backup antes se quiser guardar.</p><div class="row"><button class="btn primary" data-act="newgame">Apagar e começar outra</button><button class="btn" data-x11="newNo">Cancelar</button></div>`:`<button class="btn" data-x11="newAsk">Começar outra carreira</button>`}</section>
    <p class="lab">O Corre, versão ${X_VERSION}. O jogo salva sozinho neste navegador.</p>
  </div></div>`;
}

/* ---------- card de fim de temporada ---------- */
function xImgFromSVG(svg){return new Promise(res=>{const s=svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" ');const img=new Image();img.onload=()=>res(img);img.onerror=()=>res(null);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)})}
function xWrapText(ctx,text,maxW){const w=String(text).split(' '),L=[];let cur='';w.forEach(x=>{const t=cur?cur+' '+x:x;if(ctx.measureText(t).width>maxW&&cur){L.push(cur);cur=x}else cur=t});if(cur)L.push(cur);return L}
async function xMakeCard(){
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  try{await Promise.all(['800 64px "Baloo 2"','700 40px Nunito','800 40px Nunito'].map(f=>document.fonts.load(f)))}catch(e){}
  const D='"Baloo 2","Poppins",system-ui,sans-serif',B='Nunito,"Poppins",system-ui,sans-serif';
  const g=genreId(),col=GCOL[g]||'#FF5C8A';
  const grd=x.createLinearGradient(0,0,0,H);grd.addColorStop(0,col);grd.addColorStop(.55,'#2A1A4A');grd.addColorStop(1,'#120C22');x.fillStyle=grd;x.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){x.fillStyle=`rgba(255,246,216,${.15+Math.random()*.35})`;x.beginPath();x.arc(Math.random()*W,1000+Math.random()*900,Math.random()*3+1,0,7);x.fill()}
  x.textAlign='center';x.fillStyle='#FFCF4A';x.font=`800 72px ${D}`;x.fillText('O CORRE',W/2,150);
  x.fillStyle='rgba(255,255,255,.85)';x.font=`700 40px ${B}`;x.fillText(S.ended?`Fim do ano ${S.year||1} no Rio de Janeiro`:`Ano ${S.year||1}, semana ${S.week} no Rio de Janeiro`,W/2,215);
  const top=S.tracks.filter(t=>t.lancada&&!t.cover).sort((a,b)=>(b.plays||0)-(a.plays||0))[0]||S.tracks.find(t=>!t.cover);
  if(top){const img=await xImgFromSVG(coverSVG(top));const s=600,cx=(W-s)/2,cy=290;x.save();x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=60;x.shadowOffsetY=24;x.fillStyle='#000';x.beginPath();x.roundRect(cx,cy,s,s,36);x.fill();x.restore();
    x.save();x.beginPath();x.roundRect(cx,cy,s,s,36);x.clip();if(img)x.drawImage(img,cx,cy,s,s);x.restore();
    x.fillStyle='rgba(255,255,255,.8)';x.font=`700 38px ${B}`;x.fillText((top.lancada?'A mais ouvida: ':'No caderno: ')+'"'+top.nome+'"',W/2,cy+s+70)}
  x.fillStyle='#fff';x.font=`800 120px ${D}`;let ny=1135;xWrapText(x,S.name,W-140).slice(0,2).forEach((l,i)=>{x.fillText(l,W/2,ny+i*118)});ny+=(xWrapText(x,S.name,W-140).length>1?118:0);
  const fin=S.ended&&S.epilogo?S.epilogo.titulo:(PACK.presentation.artistNames[SEGS.slice().sort((a,b)=>S.estilo[b]-S.estilo[a])[0]]||'');
  x.font=`800 54px ${D}`;const fw=Math.min(W-120,x.measureText(fin).width+80);x.fillStyle='#FFCF4A';x.beginPath();x.roundRect((W-fw)/2,ny+40,fw,96,48);x.fill();x.fillStyle='#2A1540';x.fillText(fin,W/2,ny+106);
  const st=[[fmt(S.fas),'fãs'],[fmt(recTot()),'ouvintes'],[brl(Math.max(0,musicAvg())),'por semana com música'],[S.plei&&S.plei.weeks.length?'#'+Math.min(...S.plei.weeks.map(w=>w.rank)):'-','melhor posição no Top Plei']];
  st.forEach(([v,l],i)=>{const cx=i%2?W*.73:W*.27,cy=ny+250+Math.floor(i/2)*190;x.fillStyle='#fff';x.font=`800 76px ${D}`;x.fillText(v,cx,cy);x.fillStyle='rgba(255,255,255,.7)';x.font=`700 32px ${B}`;x.fillText(l,cx,cy+48)});
  if((S.awards||[]).length){x.fillStyle='#FFCF4A';x.font=`800 36px ${B}`;x.fillText(`${S.awards.length} prêmio${S.awards.length>1?'s':''} da Cena Carioca`,W/2,ny+650)}
  x.fillStyle='rgba(255,255,255,.55)';x.font=`700 30px ${B}`;x.fillText(location.protocol.startsWith('http')&&!/claude|localhost/.test(location.host)?location.host:'Você consegue viver da sua música?',W/2,H-80);
  return c;
}
async function xOpenCard(){UI.xCard={busy:true};render();try{const c=await xMakeCard();const url=c.toDataURL('image/png');const blob=await new Promise(r=>c.toBlob(r,'image/png'));UI.xCard={url,blob}}catch(e){UI.xCard={err:'Não deu pra gerar a imagem neste navegador.'}}render()}
function xCardHTML(){const k=UI.xCard;return`<div class="overlay"><div class="sheet xcard" role="dialog" aria-label="Card da temporada"><div class="xmenu-h"><h2>Card pra postar</h2><button class="xs-close" data-x11="cardClose" aria-label="Fechar">${qi('x')}</button></div>
  ${k.busy?'<p>Montando a imagem...</p>':k.err?`<p class="warn">${esc(k.err)}</p>`:`<img src="${k.url}" alt="Card da temporada de ${esc(S.name)}"><div class="row"><button class="btn primary" data-x11="cardSave">${qi('down')}Baixar imagem</button>${navigator.canShare?`<button class="btn" data-x11="cardShare">${qi('share')}Compartilhar</button>`:''}</div>`}</div></div>`}

/* ---------- modais ---------- */
const xRM11=renderModal;
renderModal=function(){
  const m=document.getElementById('modal');
  if(S&&UI.xCard){const kind='xcard:'+(UI.xCard.busy?'b':UI.xCard.err?'e':'ok');if(Q.modalKey!==kind){m.innerHTML=xCardHTML();Q.modalKey=kind}return}
  if(S&&UI.menu&&!UI.packError){const sc=m.querySelector('.overlay');const top=sc?sc.scrollTop:0;const was=Q.modalKey==='xmenu';m.innerHTML=xMenuHTML();Q.modalKey='xmenu';const o=m.querySelector('.overlay');if(o&&was){o.scrollTop=top;const sh=o.querySelector('.sheet');if(sh)sh.style.animation='none'}return}
  return xRM11();
};
const xEnd11=endHTML;endHTML=function(){const h=xEnd11();return h.replace('<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px">','<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px"><button class="rep-next" style="margin:0;background:#FFCF4A;color:#2A1540" data-x11="card">'+qi('share')+'Card pra postar</button>')};

/* ---------- render e cliques ---------- */
const xRender11=render;render=function(){xRender11();try{xCoach()}catch(e){}};
document.addEventListener('input',ev=>{const id=ev.target.id;if(id==='xFbIn')UI.xFb=ev.target.value;if(id==='xBkCode')UI.xBkCodeDraft=ev.target.value;if(id==='xNickIn')UI.xNickDraft=ev.target.value});
document.addEventListener('change',async ev=>{if(ev.target.id!=='xBkFile'||!ev.target.files[0])return;try{const o=JSON.parse(await ev.target.files[0].text());xApplyBackup(o)}catch(e){UI.xBkMsg=e.message&&!/JSON/.test(e.message)?e.message:'Não consegui ler esse arquivo.';UI.xBkMsgOk=false;render()}});
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-x11]');if(!b)return;ev.stopPropagation();const a=b.dataset.x11;
  switch(a){
    case 'tutNext':if(UI.xTut===X_TUT.length-1){xTutFinish();return}UI.xTut++;xCoach();return;
    case 'tutSkip':xTutFinish();return;
    case 'bkDown':xDownload(`o-corre-${xSlug(S.name)}-ano${S.year||1}-semana${S.week}.json`,new Blob([JSON.stringify(xBackupObj())],{type:'application/json'}));UI.xBkMsg='Arquivo baixado. Guarda ele em algum lugar seguro.';UI.xBkMsgOk=true;break;
    case 'bkCopy':{const code=await xBackupCode();let ok=false;try{await navigator.clipboard.writeText(code);ok=true}catch(e){}if(ok){UI.xBkMsg=`Código copiado (${fmt(code.length)} caracteres). Cola no outro aparelho em Colar código.`;UI.xBkMsgOk=true}else{UI.xBkPaste=true;UI.xBkCodeDraft=code;UI.xBkMsg='Não deu pra copiar sozinho. Seleciona o código na caixa e copia.';UI.xBkMsgOk=true}break}
    case 'bkPaste':UI.xBkPaste=!UI.xBkPaste;break;
    case 'bkLoad':try{xApplyBackup(await xReadCode(UI.xBkCodeDraft))}catch(e){UI.xBkMsg=e.message&&!/JSON|atob|decode/i.test(e.message)?e.message:'Esse código não funcionou. Confere se copiou ele inteiro.';UI.xBkMsgOk=false}break;
    case 'install':if(xInstallEvt){xInstallEvt.prompt();try{await xInstallEvt.userChoice}catch(e){}xInstallEvt=null}break;
    case 'fbSend':xSendFeedback();return;
    case 'snd':sndToggle();break;
    case 'newAsk':UI.xNewAsk=true;break;
    case 'newNo':UI.xNewAsk=false;break;
    case 'card':UI.menu=false;xOpenCard();return;
    case 'cardClose':UI.xCard=null;Q.modalKey='';break;
    case 'cardSave':if(UI.xCard&&UI.xCard.blob)xDownload(`o-corre-${xSlug(S.name)}-card.png`,UI.xCard.blob);return;
    case 'cardShare':try{const f=new File([UI.xCard.blob],'o-corre.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'O Corre'});}catch(e){}return;
    case 'nick':{const n=(UI.xNickDraft||'').trim();if(!n)return;xLS.set('ocorre-apelido',n.slice(0,24));save();await xRankPush();xRankPull(true);break}
    case 'nickOut':xLS.set('ocorre-apelido','');try{localStorage.removeItem('ocorre-apelido')}catch(e){}break;
  }
  render();
},true);
// some o menu velho de vez: limpa estados ao fechar
document.addEventListener('click',ev=>{if(ev.target.closest('[data-act="menuClose"]')){UI.xNewAsk=false;UI.xBkPaste=false;UI.xBkMsg=null;UI.xFbState=null}},true);

/* dicas ficam quietas enquanto o tutorial roda */

try{window.claude?.hot?.snapshot?.(()=>({S,UI}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
addEventListener('resize',()=>{const c=document.querySelector('.q-confetti');if(c){c.width=innerWidth;c.height=innerHeight}});
</script>
