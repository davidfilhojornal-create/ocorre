   O CORRE · interface "quarto do artista"
   Layout: quarto ilustrado em tela cheia com HUD por cima;
   objetos abrem painéis (papel) e o celular abre um aparelho com apps.
   Um único mundo visual noturno, de propósito.
   ========================================================== */
:root{
  --q-night:#171126; --q-wall:#2C2245; --q-wall2:#342853; --q-floor:#3A2B2E; --q-wood:#7B4E37; --q-wood2:#5B3828;
  --q-lamp:#FFC45C; --q-pink:#FF5C8A; --q-teal:#36D2BF; --q-violet:#8D6BFF; --q-gold:#FFCF4A; --q-cream:#FFF6E6;
  --q-ink:#2A2140; --q-display:'Baloo 2','Nunito',system-ui,sans-serif; --q-body:'Nunito','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--q-night)!important;color:var(--q-cream)}
body{font-family:var(--q-body);overflow:hidden}
#shell{display:none!important}
.q-game{position:fixed;inset:0;overflow:hidden;font-family:var(--q-body)}
.q-game[hidden]{display:none}
.q-game button{font-family:inherit}

/* ---------- palco do quarto ---------- */
.q-stage{position:absolute;left:0;right:0;bottom:0;top:calc(var(--hudH,70px) - 6px);overflow:hidden;transition:filter .45s ease,transform .45s ease}
.q-stage.dim{filter:blur(5px) brightness(.55) saturate(.9);transform:scale(1.03)}
.q-room{width:100%;height:100%;display:block;overflow:visible}
@media (max-aspect-ratio:5/4){
  .q-stage{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .q-stage::-webkit-scrollbar{display:none}
  .q-room{width:auto;height:100%;aspect-ratio:1200/760;min-width:100%}
}
.hs{cursor:pointer;outline:none}
.hs .lift{transition:transform .28s cubic-bezier(.3,1.6,.5,1),filter .28s;transform-box:fill-box;transform-origin:50% 100%}
.hs:hover .lift,.hs:focus-visible .lift{transform:translateY(-6px) scale(1.025);filter:drop-shadow(0 0 10px rgba(255,214,120,.55))}
.hs .hl{opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;transform-box:fill-box}
.hs:hover .hl,.hs:focus-visible .hl{opacity:1;transform:none}
@media (hover:none){.hs .hl{opacity:.92;transform:none}}
.hl rect{fill:#120D1F;opacity:.9}
.hl text{fill:#FFF6E6;font-family:var(--q-display);font-size:17px;font-weight:700}
.hl .sub{fill:#C9BCE6;font-size:12.5px;font-weight:600;font-family:var(--q-body)}
.q-room.enter .hs{animation:qDrop .8s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:var(--d,0s)}
@keyframes qDrop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.tw{animation:qTwinkle 3.2s ease-in-out infinite;animation-delay:var(--t,0s)}
@keyframes qTwinkle{0%,100%{opacity:.25}50%{opacity:1}}
.flick{animation:qFlick 6s steps(1) infinite;animation-delay:var(--t,0s)}
@keyframes qFlick{0%,62%{opacity:1}63%,70%{opacity:.15}71%,100%{opacity:1}}
.steam path{animation:qSteam 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.2s}
@keyframes qSteam{0%{opacity:0;transform:translateY(8px) scaleY(.6)}30%{opacity:.7}100%{opacity:0;transform:translateY(-26px) scaleY(1.1)}}
.glow{animation:qBreath 4.5s ease-in-out infinite}
@keyframes qBreath{0%,100%{opacity:.42}50%{opacity:.6}}
.sway{animation:qSway 7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes qSway{0%,100%{transform:skewX(0)}50%{transform:skewX(2deg)}}
.leaf{animation:qLeaf 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes qLeaf{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.cone{animation:qCone 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes qCone{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
.led{animation:qLed 4s linear infinite}
@keyframes qLed{0%{fill:#FF5C8A}33%{fill:#8D6BFF}66%{fill:#36D2BF}100%{fill:#FF5C8A}}
#qPhoneObj.buzz .lift{animation:qBuzz 2.6s ease-in-out infinite}
@keyframes qBuzz{0%,72%,100%{transform:none}75%{transform:translateX(-2px) rotate(-3deg)}78%{transform:translateX(2px) rotate(3deg)}81%{transform:translateX(-2px) rotate(-2deg)}84%{transform:translateX(2px) rotate(2deg)}87%{transform:none}}
.ring{animation:qRing 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes qRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.pulse{animation:qPulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes qPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.sparkle{animation:qSpark 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes qSpark{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.chartline{stroke-dasharray:220;stroke-dashoffset:220;animation:qDraw 3.5s ease-out infinite}
@keyframes qDraw{0%{stroke-dashoffset:220}60%,100%{stroke-dashoffset:0}}

/* ---------- HUD ---------- */
.q-hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(#0E0A18EE,#0E0A1800);pointer-events:none}
.q-hud>*{pointer-events:auto}
.hud-me{display:flex;align-items:center;gap:10px;background:#1A1330D9;border:1px solid #3A2E5C;border-radius:18px;padding:6px 14px 6px 6px;color:var(--q-cream);cursor:pointer;backdrop-filter:blur(8px)}
.hud-av{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-family:var(--q-display);font-weight:800;font-size:18px;color:#fff;overflow:hidden;flex:none}
.hud-me b{font-family:var(--q-display);font-size:17px;line-height:1;display:block;font-weight:700}
.hud-me small{font-size:11.5px;color:#BFB2DE;font-weight:700}
.hud-week{display:flex;flex-direction:column;gap:4px;background:#1A1330D9;border:1px solid #3A2E5C;border-radius:16px;padding:7px 12px;min-width:110px;backdrop-filter:blur(8px)}
.hud-week span{font-size:11px;color:#BFB2DE;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.hud-week b{font-family:var(--q-display);font-size:17px;line-height:1}
.hud-bar{height:6px;border-radius:4px;background:#2F2550;overflow:hidden}
.hud-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--q-pink),var(--q-gold));transition:width .8s cubic-bezier(.2,.9,.2,1)}
.hud-stats{display:flex;gap:8px;flex-wrap:wrap}
.chipq{position:relative;display:flex;align-items:center;gap:8px;background:#1A1330D9;border:1px solid #3A2E5C;border-radius:16px;padding:6px 12px 6px 7px;backdrop-filter:blur(8px)}
.chipq .ic{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;flex:none}
.chipq .ic svg{width:17px;height:17px}
.chipq span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#BFB2DE}
.chipq b{font-family:var(--q-display);font-size:18px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chipq b.neg{color:#FF8E8E}
.chipq .ebar{width:60px;height:6px;border-radius:4px;background:#2F2550;overflow:hidden;margin-top:3px}
.chipq .ebar i{display:block;height:100%;border-radius:4px;transition:width .8s}
.hud-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.hud-goal{background:#1A1330D9;border:1px solid #3A2E5C;border-radius:16px;padding:7px 12px;min-width:150px;backdrop-filter:blur(8px)}
.hud-goal span{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#BFB2DE}
.hud-goal b{font-family:var(--q-display);font-size:15px}
.hud-goal .hud-bar i{background:linear-gradient(90deg,var(--q-teal),#9BFFB8)}
.q-ibtn{width:44px;height:44px;border-radius:15px;border:1px solid #3A2E5C;background:#1A1330D9;color:var(--q-cream);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.q-ibtn:hover{transform:rotate(25deg)}
.q-ibtn svg{width:20px;height:20px}
.q-sleep{display:flex;align-items:center;gap:9px;height:46px;padding:0 18px 0 14px;border-radius:16px;border:0;cursor:pointer;color:#2A1540;font-family:var(--q-display);font-size:17px;font-weight:800;
  background:linear-gradient(135deg,#FFD36E,#FF8FB1);box-shadow:0 5px 0 #B04C77,0 10px 24px #FF5C8A55;transition:transform .12s,box-shadow .12s}
.q-sleep:hover{transform:translateY(-2px)}
.q-sleep:active{transform:translateY(4px);box-shadow:0 1px 0 #B04C77}
.q-sleep svg{width:20px;height:20px}
.q-sleep[disabled]{filter:grayscale(1);opacity:.5;cursor:not-allowed}
.float-delta{position:absolute;right:8px;top:-4px;font-family:var(--q-display);font-weight:800;font-size:15px;pointer-events:none;animation:qFloat 1.8s ease-out forwards;white-space:nowrap}
@keyframes qFloat{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@media (max-width:900px){
  .hud-goal{display:none}
  .q-sleep span{display:none}.q-sleep{padding:0 13px}
  .chipq{padding:5px 9px 5px 5px}.chipq .ic{width:24px;height:24px}.chipq b{font-size:15px}.chipq span{display:none}
  .hud-me small{display:none}.hud-week{min-width:84px}
}
@media (max-width:560px){
  .q-hud{gap:6px}
  .hud-me{padding:4px 10px 4px 4px}.hud-av{width:32px;height:32px}.hud-me b{font-size:14px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hud-stats{order:5;width:100%;gap:6px}.chipq{flex:1;min-width:0;justify-content:center}
  .q-ibtn{width:40px;height:40px}.q-sleep{height:42px}
}

/* ---------- barra rápida (celular) ---------- */
.q-dock{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:none;gap:6px;padding:7px;border-radius:22px;background:#140E24E6;border:1px solid #3A2E5C;backdrop-filter:blur(10px)}
.q-dock button{position:relative;width:50px;height:50px;border-radius:16px;border:0;background:#2A2046;color:#fff;display:grid;place-items:center;cursor:pointer}
.q-dock button svg{width:22px;height:22px}
.q-dock .bd{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:10px;background:var(--q-pink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;animation:qPulse 1.8s infinite}
@media (max-aspect-ratio:5/4){.q-dock{display:flex}}

/* ---------- painéis dos objetos ---------- */
.q-layer{position:absolute;inset:0;z-index:40;display:none}
.q-layer.open{display:block}
.q-backdrop{position:absolute;inset:0;background:#0A0714A6}
.q-card{position:absolute;left:50%;top:calc(50% + 24px);transform:translate(-50%,-50%);width:min(1120px,calc(100vw - 32px));max-height:calc(100dvh - 110px);display:flex;flex-direction:column;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px #0009}
.q-card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;flex:none}
.q-card-h .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.q-card-h .ico svg{width:24px;height:24px}
.q-card-h h2{margin:0;font-family:var(--q-display);font-size:24px;line-height:1;font-weight:800}
.q-card-h p{margin:2px 0 0;font-size:13px;font-weight:700;opacity:.75}
.q-close{margin-left:auto;width:42px;height:42px;border-radius:14px;border:0;cursor:pointer;display:grid;place-items:center;transition:transform .2s}
.q-close:hover{transform:rotate(90deg)}
.q-close svg{width:20px;height:20px}
.q-card-b{overflow-y:auto;padding:4px 20px 22px;flex:1;min-height:0}
.q-card-b>.wrap,.q-card-b>div{max-width:none}
.q-card-b>*{animation:qRise .45s cubic-bezier(.2,.9,.2,1) backwards}
.q-card-b.static>*{animation:none}
@keyframes qRise{from{opacity:0;transform:translateY(14px)}}
@media (max-width:700px){
  .q-card{left:0;right:0;bottom:0;top:auto;transform:none;width:auto;max-height:calc(100dvh - 70px);border-radius:26px 26px 0 0}
  .q-card-b{padding:4px 14px calc(22px + env(safe-area-inset-bottom,0px))}
  .q-card-h h2{font-size:21px}
}
/* temas de papel */
.th-paper,.th-cal,.th-nb,.th-mural,.th-modal{
  --bg:#F6ECD6;--panel:#FFFBF2;--soft:#F1E5CB;--ink:#2A2140;--ink2:#5F5470;--ink3:#8E8399;--line:#E6D8BB;--line2:#D3C29F;
  --accent:#E8467C;--accent-soft:#FDE0EA;--on-accent:#fff;--good:#1E8A59;--bad:#D2433A;--warn:#B06600;--me:#DCF4E4;--on-me:#123322;
  --rua:#D2541B;--pista:#7048E0;--feed:#DE2E70;--sala:#13808E;--sans:var(--q-body);--mono:'IBM Plex Mono',ui-monospace,monospace;
  background:var(--bg);color:var(--ink)}
.th-cal .q-card-h{background:#FF5C8A;color:#fff}.th-cal .q-card-h .ico{background:#fff3;color:#fff}.th-cal .q-close{background:#fff3;color:#fff}
.th-cal .q-card-h::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:radial-gradient(circle at 12px 5px,#2A2140 4px,transparent 5px) 0 0/48px 10px repeat-x;opacity:.5}
.th-nb{background:var(--bg) repeating-linear-gradient(transparent 0 31px,#D9E4F2 31px 32px)}
.th-nb .q-card-h{background:#2F6FD6;color:#fff}.th-nb .q-card-h .ico{background:#fff3;color:#fff}.th-nb .q-close{background:#fff3;color:#fff}
.th-nb .q-card-b{background:linear-gradient(90deg,transparent 46px,#F1A7B8 46px,#F1A7B8 48px,transparent 48px)}
@media (max-width:700px){.th-nb .q-card-b{background:none}}
.th-mural .q-card-h{background:#B97D49;color:#2B1606;background-image:radial-gradient(#8F5C31 1px,transparent 1.5px);background-size:9px 9px}
.th-mural .q-card-h .ico{background:#FFE7A8;color:#6B3C12}.th-mural .q-close{background:#FFE7A8;color:#6B3C12}
.th-lap{--bg:#121621;--panel:#1A2030;--soft:#232B3D;--ink:#EEF1F8;--ink2:#AFB7C8;--ink3:#7F889B;--line:#283044;--line2:#3A4560;
  --accent:#36D2BF;--accent-soft:#11393A;--on-accent:#04201C;--good:#5BE38F;--bad:#FF7A6B;--warn:#FFC45C;--me:#1D3A29;--on-me:#D5F3E0;
  --rua:#FF8A4C;--pista:#A58BFF;--feed:#FF6FA0;--sala:#3FD0E0;--sans:var(--q-body);--mono:'IBM Plex Mono',ui-monospace,monospace;background:var(--bg);color:var(--ink)}
.th-lap .q-card-h{background:#0C1018;color:#EEF1F8;border-bottom:1px solid #283044}.th-lap .q-card-h .ico{background:#11393A;color:#36D2BF}.th-lap .q-close{background:#232B3D;color:#EEF1F8}
.th-win{--bg:#151B36;--panel:#1E2649;--soft:#28315A;--ink:#F1F3FF;--ink2:#B7BEE3;--ink3:#8790BF;--line:#2E3866;--line2:#46518A;--accent:#FFCF4A;--accent-soft:#3D3416;--on-accent:#2A1F00;--good:#5BE38F;--bad:#FF7A6B;--warn:#FFC45C;--sans:var(--q-body);background:var(--bg);color:var(--ink)}
.th-win .q-card-h{background:linear-gradient(180deg,#0E1330,#26316A);color:#fff;position:relative;overflow:hidden}
.th-win .q-card-h .ico{background:#FFE8B033;color:#FFE8B0}.th-win .q-close{background:#ffffff1f;color:#fff}

/* componentes do jogo dentro dos temas */
.q-game .card,.q-modal .card{border-radius:18px;border-width:1.5px}
.q-game .btn,.q-modal .btn{border-radius:12px;border-width:1.5px;font-weight:700;transition:transform .12s,box-shadow .12s}
.q-game .btn:active,.q-modal .btn:active{transform:scale(.96)}
.q-game .btn.primary,.q-modal .btn.primary{box-shadow:0 4px 0 #0005}
.q-game .slot{border-radius:18px;border-width:1.5px;transition:transform .3s}
.q-game .slot.pop{animation:qSlotPop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes qSlotPop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.q-game .act{border-radius:12px;transition:background .15s,transform .15s}
.q-game .act:hover:not(:disabled){transform:translateX(3px)}
.q-game .opt,.q-modal .opt{border-radius:14px;border-width:1.5px;transition:transform .15s,border-color .15s}
.q-game .opt:hover:not(:disabled),.q-modal .opt:hover:not(:disabled){transform:translateY(-2px)}
.q-game .ico{border-radius:11px}
.q-game .idea{border-radius:14px;font-weight:700}
.q-game .pill{border-radius:20px}
.q-game .big{font-family:var(--q-display);font-weight:700}
.q-game h2{font-family:var(--q-display)}
.q-game .bar,.q-modal .bar{border-radius:6px}
.q-game .bar i{border-radius:6px}

/* ---------- celular ---------- */
.q-phone-layer{position:absolute;inset:0;z-index:50;display:none}
.q-phone-layer.open{display:block}
.q-phone-layer .q-backdrop{background:#0A0714B3}
.q-dev{position:absolute;left:50%;top:50%;width:400px;height:min(820px,calc(100dvh - 40px));transform:translate(-50%,-50%);
  border-radius:52px;background:#0D0A14;padding:12px;box-shadow:0 0 0 2px #3B3152,0 0 0 9px #1B1528,0 40px 90px #000B,inset 0 0 0 2px #2A2236}
.q-dev::before{content:"";position:absolute;right:-12px;top:150px;width:4px;height:70px;border-radius:2px;background:#2A2236}
.q-dev::after{content:"";position:absolute;left:-12px;top:130px;width:4px;height:44px;border-radius:2px;background:#2A2236;box-shadow:0 60px 0 #2A2236}
.q-screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;display:flex;flex-direction:column;
  --bg:#16111F;--panel:#211A2E;--soft:#2C2340;--ink:#F4EEFF;--ink2:#BDB2D3;--ink3:#8D82A5;--line:#33284A;--line2:#4A3D68;
  --accent:#FF5C8A;--accent-soft:#3D1B2B;--on-accent:#fff;--good:#5BE38F;--bad:#FF7A7A;--warn:#FFC45C;--me:#2E7D5B;--on-me:#F0FFF6;
  --rua:#FF8A4C;--pista:#A58BFF;--feed:#FF6FA0;--sala:#3FD0E0;--sans:var(--q-body);background:var(--bg);color:var(--ink)}
.q-island{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;background:#000;z-index:5}
.q-status{display:flex;justify-content:space-between;align-items:center;padding:15px 28px 6px;font-size:14px;font-weight:800;flex:none;position:relative;z-index:4}
.q-status svg{width:16px;height:16px}
.q-app{flex:1;min-height:0;overflow-y:auto;position:relative;scrollbar-width:none}
.q-app::-webkit-scrollbar{display:none}
.q-homebar{flex:none;height:26px;display:grid;place-items:center;cursor:pointer;background:transparent;border:0;width:100%}
.q-homebar i{display:block;width:130px;height:5px;border-radius:3px;background:#F4EEFF;opacity:.85}
.q-screen.boot::after{content:"";position:absolute;inset:0;background:#fff;opacity:0;animation:qBoot .7s ease-out;pointer-events:none;z-index:9}
@keyframes qBoot{0%{opacity:.85}100%{opacity:0}}
@media (max-width:560px){
  .q-dev{left:0;top:0;width:100%;height:100%;transform:none;border-radius:0;padding:0;box-shadow:none}
  .q-dev::before,.q-dev::after{display:none}
  .q-screen{border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .q-island{display:none}
}
/* tela inicial do celular */
.home{min-height:100%;padding:8px 18px 18px;display:flex;flex-direction:column;gap:14px}
.home-clock{text-align:center;padding:8px 0 4px}
.home-clock b{display:block;font-family:var(--q-display);font-size:62px;line-height:1;font-weight:700;letter-spacing:-1px}
.home-clock span{font-size:14px;font-weight:700;color:#D8CCF2}
.wid{border-radius:24px;padding:14px;cursor:pointer;border:0;text-align:left;color:#fff;width:100%;transition:transform .2s;display:block}
.wid:active{transform:scale(.97)}
.wid-week{background:#ffffff1c;backdrop-filter:blur(12px)}
.wid small{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.wid-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.wid-row span{border-radius:12px;padding:8px 6px;font-size:12px;font-weight:800;text-align:center;min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.wid-row span em{font-style:normal;font-size:10px;opacity:.8;font-weight:700}
.wid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wid-bank{background:linear-gradient(140deg,#FFD36E,#FFAE4C);color:#3A2100}
.wid-rank{background:linear-gradient(140deg,#1DB988,#0E7A63)}
.wid b.n{display:block;font-family:var(--q-display);font-size:24px;line-height:1.1;font-weight:800;margin-top:6px}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;margin-top:4px}
.appi{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:#fff;cursor:pointer;font-size:12px;font-weight:700;position:relative}
.appi i{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;box-shadow:0 6px 16px #0006;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.appi:hover i{transform:translateY(-3px) scale(1.05)}
.appi:active i{transform:scale(.9)}
.appi i svg{width:30px;height:30px}
.appi .bd{position:absolute;top:-6px;right:2px;min-width:22px;height:22px;border-radius:11px;background:#FF3B5C;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px #1A1330;animation:qBadge 2s ease-in-out infinite}
@keyframes qBadge{0%,85%,100%{transform:scale(1)}90%{transform:scale(1.25)}}
.home.pop .appi,.home.pop .wid{animation:qIcon .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i,0)*45ms + .2s)}
@keyframes qIcon{from{opacity:0;transform:scale(.4) translateY(20px)}}
.dockq{margin-top:auto;display:flex;justify-content:space-around;padding:12px;border-radius:30px;background:#ffffff1f;backdrop-filter:blur(14px)}
/* cabeçalho de app */
.app-h{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 16px 12px;background:var(--bg)}
.app-h h3{margin:0;font-family:var(--q-display);font-size:26px;font-weight:800;line-height:1.1}
.app-h .back{width:36px;height:36px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.app-h .back svg{width:18px;height:18px}
.app-h .chip{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px;background:var(--accent);color:#fff}
.app-pad{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.q-app.zoom{animation:qAppIn .42s cubic-bezier(.2,.9,.2,1)}
@keyframes qAppIn{from{transform:scale(.35);opacity:0;border-radius:40px}}
.q-app.slide{animation:qAppBack .32s ease-out}
@keyframes qAppBack{from{transform:scale(1.08);opacity:0}}
/* zap */
.zap{--zbg:#0F1A17}
.zl{display:flex;flex-direction:column}
.zi{display:flex;gap:12px;align-items:center;padding:11px 16px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;width:100%;transition:background .15s}
.zi:hover{background:var(--soft)}
.zi .av{width:50px;height:50px;border-radius:50%;font-size:15px;flex:none}
.zi .g{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:11px}
.zi .n{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:15px}
.zi .n small{font-weight:700;color:var(--ink3);font-size:11.5px}
.zi .p{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--ink2);margin-top:2px}
.zi .p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zi.unread .p span{color:var(--ink);font-weight:700}
.zi .dot{min-width:22px;height:22px;border-radius:11px;background:#25D366;color:#062B14;font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.zt{display:flex;flex-direction:column;min-height:100%}
.zt-h{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:6px 12px 10px;background:#1E1830;border-bottom:1px solid var(--line)}
.zback{width:36px;height:36px;border-radius:12px;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}.zback svg{width:18px;height:18px}
.q-app .plei-head{display:none}
.zt-h .av{width:40px;height:40px;border-radius:50%;font-size:13px}
.zt-h b{display:block;font-size:15.5px;font-weight:800}
.zt-h small{font-size:11.5px;color:var(--ink3);font-weight:700}
.zmsgs{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:#120E1A;background-image:radial-gradient(#ffffff08 1px,transparent 1.5px);background-size:18px 18px}
.zsep{align-self:center;font-size:11px;font-weight:800;color:var(--ink2);background:#2A2240;border-radius:10px;padding:3px 10px;margin:8px 0}
.zb{max-width:84%;padding:8px 12px;border-radius:18px 18px 18px 5px;background:#2A2240;font-size:14.5px;line-height:1.42;align-self:flex-start;color:#F4EEFF}
.zb.me{align-self:flex-end;background:#2E7D5B;border-radius:18px 18px 5px 18px;color:#F0FFF6}
.zb.ghost{background:transparent;border:1.5px dashed #4A3D68;color:var(--ink3);font-style:italic}
.zb.pop{animation:qBubble .45s cubic-bezier(.3,1.6,.5,1) backwards}
.zb.me.pop{transform-origin:100% 100%}
.zb.pop:not(.me){transform-origin:0 100%}
@keyframes qBubble{from{opacity:0;transform:scale(.5)}}
.typing{align-self:flex-start;background:#2A2240;border-radius:18px 18px 18px 5px;padding:12px 14px;display:flex;gap:5px}
.typing i{width:8px;height:8px;border-radius:50%;background:#BDB2D3;animation:qDots 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes qDots{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
.zreply{position:sticky;bottom:0;background:#1E1830;border-top:1px solid var(--line);padding:10px 10px 12px;display:flex;flex-direction:column;gap:7px;z-index:3}
.zreply .lab{font-size:11.5px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
.zq{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid #4A3D68;background:#2A2240;color:#F4EEFF;border-radius:16px;padding:9px 13px;cursor:pointer;font-size:14px;font-weight:700;transition:transform .15s,border-color .15s,background .15s;animation:qRise .35s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.zq:hover:not(:disabled){border-color:#25D366;transform:translateY(-1px)}
.zq:active:not(:disabled){transform:scale(.97)}
.zq:disabled{opacity:.45;cursor:not-allowed;border-style:dashed}
.zq span{font-size:12px;color:#BDB2D3;font-weight:600}
/* banco */
.bank-hero{margin:4px 14px 0;border-radius:26px;padding:20px;background:linear-gradient(140deg,#FFD36E,#FF9F5A);color:#3A1E00}
.bank-hero small{font-weight:800;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.bank-hero b{display:block;font-family:var(--q-display);font-size:40px;line-height:1.1;font-weight:800}
.bank-hero span{font-size:13px;font-weight:700}
.tx{display:flex;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tx b{font-family:var(--q-display);font-weight:700;white-space:nowrap}
.bank-bars{display:flex;align-items:flex-end;gap:5px;height:90px;padding-top:10px}
.bank-bars i{flex:1;border-radius:5px 5px 2px 2px;background:var(--q-teal);min-height:3px;animation:qGrow .7s cubic-bezier(.2,.9,.2,1) backwards;transform-origin:bottom;animation-delay:calc(var(--i)*40ms)}
.bank-bars i.lo{background:#6D6190}
@keyframes qGrow{from{transform:scaleY(0)}}
/* apps reaproveitados */
.q-app .plei{border-radius:0;padding:14px;gap:14px;min-height:100%}
.q-app .plei-hero{flex-direction:column;align-items:flex-start;gap:12px}
.q-app .plei-hero .cover{width:110px;height:110px}
.q-app .plei h2{font-size:26px}
.q-app .plei-song{grid-template-columns:14px 40px minmax(0,1fr) 62px;gap:8px;font-size:13px}
.q-app .plei-rank{grid-template-columns:26px minmax(0,1fr) 86px!important;font-size:13px}
.q-app .people{grid-template-columns:minmax(0,1fr)!important}
.q-app .card{border-radius:18px}
.q-app .setbuttons{gap:6px}
.q-app .setbuttons .btn{padding:6px 10px;font-size:12.5px}
.q-app .relbar{height:7px}

/* ---------- notificações ---------- */
.q-toasts{position:fixed;left:50%;top:calc(var(--hudH,70px) + 6px);transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:10px;width:min(400px,calc(100vw - 24px));pointer-events:none}
body.q-phone-on .q-toasts{top:calc(14px + env(safe-area-inset-top,0px))}
.q-toast{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;background:#1F1833F2;border:1px solid #43376A;box-shadow:0 14px 40px #000A;color:#F4EEFF;cursor:pointer;backdrop-filter:blur(14px);
  animation:qToastIn .6s cubic-bezier(.3,1.5,.5,1)}
.q-toast.out{animation:qToastOut .35s ease-in forwards}
@keyframes qToastIn{from{opacity:0;transform:translateY(-60px) scale(.9)}}
@keyframes qToastOut{to{opacity:0;transform:translateY(-30px) scale(.95)}}
.q-toast .av{width:42px;height:42px;border-radius:14px;font-size:14px;flex:none}
.q-toast b{font-size:14.5px;font-weight:800;display:block}
.q-toast p{margin:1px 0 0;font-size:13px;color:#CFC4E6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-toast small{margin-left:auto;align-self:flex-start;font-size:11px;color:#9C90B8;font-weight:700;white-space:nowrap}
.q-toast.gold{background:linear-gradient(135deg,#5A3A00F2,#2A1B48F2);border-color:#FFCF4A}
.q-toast.gold .av{background:linear-gradient(135deg,#FFE58A,#FFB020);color:#4A2A00}

/* ---------- transição de semana ---------- */
.q-dawn{position:fixed;inset:0;z-index:300;pointer-events:none;display:none}
.q-dawn.play{display:block}
.q-dawn .sky{position:absolute;inset:0;background:linear-gradient(180deg,#0E0A1F 0%,#3A1E5C 45%,#FF7A8A 78%,#FFD36E 100%);animation:qDawn 1.7s ease-in-out forwards}
.q-dawn .sun{position:absolute;left:50%;bottom:-120px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:#FFE28A;box-shadow:0 0 120px 40px #FFB86A;animation:qSun 1.7s ease-in-out forwards}
.q-dawn .txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.q-dawn .txt b{font-family:var(--q-display);font-size:clamp(46px,11vw,110px);font-weight:800;color:#fff;letter-spacing:-1px;text-shadow:0 6px 30px #0007;animation:qStamp 1.7s cubic-bezier(.3,1.5,.5,1) forwards}
.q-dawn .txt span{display:block;font-size:18px;font-weight:800;color:#FFE9C2;letter-spacing:.1em;text-transform:uppercase}
@keyframes qDawn{0%{opacity:0}18%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes qSun{0%{transform:translateY(0)}70%{transform:translateY(-260px)}100%{transform:translateY(-300px);opacity:0}}
@keyframes qStamp{0%{opacity:0;transform:scale(1.6)}22%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.96)}}

/* ---------- modais (resultado, início, repertório) ---------- */
.q-modal .overlay{z-index:200;background:#0A0714C7;backdrop-filter:blur(6px);padding-top:max(26px,env(safe-area-inset-top,0px))}
.q-modal .sheet{--bg:#F6ECD6;--panel:#FFFBF2;--soft:#F1E5CB;--ink:#2A2140;--ink2:#5F5470;--ink3:#8E8399;--line:#E6D8BB;--line2:#D3C29F;
  --accent:#E8467C;--accent-soft:#FDE0EA;--on-accent:#fff;--good:#1E8A59;--bad:#D2433A;--warn:#B06600;--sans:var(--q-body);
  background:var(--bg);color:var(--ink);border-radius:26px;box-shadow:0 30px 90px #000B;animation:qSheet .5s cubic-bezier(.3,1.4,.5,1)}
.q-modal .sheet h2{font-family:var(--q-display);font-weight:800}
@keyframes qSheet{from{opacity:0;transform:translateY(30px) scale(.94)}}
/* resultado da semana */
.rep-ov{align-items:flex-start}
.rep{width:min(760px,100%);display:flex;flex-direction:column;gap:16px;color:#F4EEFF}
.rep-top{text-align:center;padding:10px 0 2px}
.rep-week{display:inline-block;font-family:var(--q-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#2A1540;background:linear-gradient(135deg,#FFD36E,#FF8FB1);padding:5px 16px;border-radius:30px;animation:qStampIn .6s cubic-bezier(.3,1.6,.5,1) backwards}
.rep-h{font-family:var(--q-display);font-size:clamp(30px,6vw,52px);line-height:1.02;margin:12px 0 0;font-weight:800;text-wrap:balance;animation:qStampIn .7s .12s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes qStampIn{from{opacity:0;transform:scale(1.7) rotate(-4deg)}}
.rep-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rep-stat{border-radius:20px;padding:12px 14px;background:#ffffff12;border:1px solid #ffffff1f;animation:qRise .5s cubic-bezier(.2,.9,.2,1) backwards;animation-delay:calc(.35s + var(--i)*70ms)}
.rep-stat span{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#C9BCE6}
.rep-stat b{display:block;font-family:var(--q-display);font-size:28px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.rep-stat b.pos{color:#7CF2A6}.rep-stat b.neg{color:#FF8E8E}
.rep-cards{display:flex;flex-direction:column;gap:10px}
.rep-card{--bg:#FFFBF2;background:#FFFBF2;color:#2A2140;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 0 #0003;animation:qFlipIn .65s cubic-bezier(.3,1.3,.5,1) backwards;animation-delay:calc(.8s + var(--i)*.28s);transform-origin:50% 0}
@keyframes qFlipIn{from{opacity:0;transform:perspective(700px) rotateX(-75deg)}}
.rep-card p{margin:0;font-size:14.5px;line-height:1.5}
.rep-slot{display:flex;align-items:center;gap:8px;font-family:var(--q-display);font-size:16px;font-weight:800;color:#E8467C}
.rep-slot i{width:9px;height:9px;border-radius:50%;background:currentColor}
.rep-scene{border-radius:20px;padding:14px 16px;background:#ffffff10;border:1px solid #ffffff1c;animation:qRise .5s backwards;animation-delay:calc(1.7s);display:flex;flex-direction:column;gap:6px}
.rep-scene h3{margin:0;font-family:var(--q-display);font-size:17px;font-weight:800;color:#FFCF4A}
.rep-scene p{margin:0;font-size:14px;line-height:1.5;color:#E6DDF6}
.rep-chat{display:flex;flex-direction:column;gap:6px;animation:qRise .5s backwards;animation-delay:1.9s}
.rep-chat .zb{max-width:90%}
.rep-chat .zb b{font-weight:800;color:#FFCF4A}
.rep-foot{font-size:12.5px;color:#B8ABD6;text-align:center;margin:0}
.rep-next{align-self:center;margin:4px 0 30px;height:56px;padding:0 28px;border:0;border-radius:18px;cursor:pointer;font-family:var(--q-display);font-weight:800;font-size:19px;color:#2A1540;
  background:linear-gradient(135deg,#FFD36E,#FF8FB1);box-shadow:0 6px 0 #B04C77,0 14px 34px #FF5C8A66;animation:qRise .5s 2.1s backwards,qGlowBtn 2.4s 2.6s ease-in-out infinite;display:flex;align-items:center;gap:10px}
.rep-next:active{transform:translateY(4px);box-shadow:0 2px 0 #B04C77}
.rep-next svg{width:22px;height:22px}
@keyframes qGlowBtn{0%,100%{box-shadow:0 6px 0 #B04C77,0 14px 34px #FF5C8A66}50%{box-shadow:0 6px 0 #B04C77,0 14px 50px #FFD36EAA}}
@media (max-width:560px){.rep-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.rep-stat b{font-size:23px}}
.q-confetti{position:fixed;inset:0;pointer-events:none;z-index:400}
.q-hint{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:19;display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:18px;background:#1A1330E6;border:1px solid #4A3D68;color:#F4EEFF;font-weight:700;font-size:14px;white-space:nowrap;backdrop-filter:blur(10px);animation:qRise .6s 1.2s backwards,qHintBob 2.6s 2s ease-in-out infinite;cursor:pointer}
.q-hint svg{width:20px;height:20px;color:#FFD36E}
@keyframes qHintBob{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-5px)}}
@media (max-aspect-ratio:5/4){.q-hint{bottom:calc(92px + env(safe-area-inset-bottom,0px));white-space:normal;width:max-content;max-width:calc(100vw - 32px);font-size:13px}}
/* tela inicial */
.st-ov{position:fixed;inset:0;z-index:200;overflow-y:auto;background:#140E24;display:flex;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.st-bg{position:fixed;inset:0;opacity:.35;filter:blur(3px);pointer-events:none}
.st{position:relative;width:min(900px,100%);display:flex;flex-direction:column;gap:18px;color:#F4EEFF}
.st-title{text-align:center;padding:18px 0 0}
.st-title h1{margin:0;font-family:var(--q-display);font-weight:800;font-size:clamp(64px,14vw,132px);line-height:.9;letter-spacing:-2px}
.st-title h1 span{display:inline-block;animation:qLetter .8s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i)*70ms)}
.st-title h1 span:nth-child(odd){color:#FFD36E}.st-title h1 span:nth-child(even){color:#FF8FB1}
@keyframes qLetter{from{opacity:0;transform:translateY(-80px) rotate(-20deg)}}
.st-title p{margin:8px 0 0;font-size:18px;font-weight:700;color:#D8CCF2;animation:qRise .6s .7s backwards}
.st-box{background:#ffffff0f;border:1px solid #ffffff1c;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:qRise .6s backwards;animation-delay:var(--d)}
.st-box>label,.st-box>.lb{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#C9BCE6}
.st-box input,.st-box select{font:inherit;font-family:var(--q-display);font-size:24px;font-weight:700;padding:10px 16px;border-radius:16px;border:2px solid #4A3D68;background:#1C1530;color:#fff}
.st-box select{font-size:17px}
.st-box input:focus{border-color:#FFD36E;outline:none}
.st-genres{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.st-g{position:relative;border:0;border-radius:22px;padding:14px;cursor:pointer;text-align:left;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s;overflow:hidden}
.st-g:hover{transform:translateY(-4px) rotate(-1deg)}
.st-g[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 12px 30px #0008;transform:translateY(-4px)}
.st-g svg{width:46px;height:46px}
.st-g b{font-family:var(--q-display);font-size:22px;line-height:1;font-weight:800}
.st-g span{font-size:12.5px;font-weight:700;opacity:.9}
.st-g small{font-size:11.5px;opacity:.8;font-weight:600}
.st-origins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st-o{border:2px solid #3E3260;background:#1C1530;border-radius:20px;padding:14px;text-align:left;color:#F4EEFF;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .2s,border-color .2s}
.st-o:hover{transform:translateY(-2px)}
.st-o[aria-pressed="true"]{border-color:#FFD36E;background:#2A1F44}
.st-o b{font-family:var(--q-display);font-size:18px;font-weight:800}
.st-o span{font-size:13px;color:#CFC4E6;line-height:1.45}
.st-go{align-self:center;height:62px;padding:0 34px;border:0;border-radius:20px;cursor:pointer;font-family:var(--q-display);font-weight:800;font-size:22px;color:#2A1540;background:linear-gradient(135deg,#FFD36E,#FF8FB1);box-shadow:0 7px 0 #B04C77,0 16px 40px #FF5C8A66;display:flex;align-items:center;gap:10px;animation:qRise .6s .9s backwards,qGlowBtn 2.4s 1.6s ease-in-out infinite;margin-bottom:20px}
.st-go:active{transform:translateY(5px);box-shadow:0 2px 0 #B04C77}
.st-go svg{width:24px;height:24px}

function qDismissHint(){try{localStorage.setItem('ocorre-dica','1')}catch(e){}const h=$q('qHint');if(h){h.style.transition='opacity .3s';h.style.opacity='0';setTimeout(()=>h.remove(),320)}}
function qCount(el,from,to,f,ms){const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=f(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

/* ---------- animação a partir de um objeto ---------- */
function qRectOf(id){const el=$q(id);if(!el)return null;const r=el.getBoundingClientRect();if(!r.width)return null;return r}
function qFlyFrom(el,from,opts={}){
  if(Q.reduce||!from||!el.animate)return null;
  const to=el.getBoundingClientRect();if(!to.width)return null;
  const sx=from.width/to.width,sy=from.height/to.height,s=Math.max(.06,Math.min(sx,sy));
  const dx=(from.left+from.width/2)-(to.left+to.width/2),dy=(from.top+from.height/2)-(to.top+to.height/2);
  const base=getComputedStyle(el).transform;const b=base==='none'?'':base;
  const kf=[{transform:`translate(${dx}px,${dy}px) ${b} scale(${s}) rotate(${opts.rot||0}deg)`,opacity:opts.fade?0:.4},{transform:`${b} scale(1.02)`,opacity:1,offset:.75},{transform:b||'none',opacity:1}];
  return el.animate(opts.reverse?kf.slice().reverse():kf,{duration:opts.ms||620,easing:opts.reverse?'cubic-bezier(.5,0,.8,.4)':'cubic-bezier(.2,.9,.25,1.1)',fill:'both'});
}

function qPanel(){

  if(!cfg){if(layer.classList.contains('open')&&!layer.dataset.closing)qClosePanel(true);return}
  const isNew=!layer.classList.contains('open')||layer.dataset.k!==v;
  if(isNew){
    layer.dataset.k=v;delete layer.dataset.closing;layer.className='q-layer open';
    layer.innerHTML=`<div class="q-backdrop" data-ui="close"></div><section class="q-card ${cfg.th}" id="qCard" role="dialog" aria-label="${esc(cfg.t)}"><header class="q-card-h"><span class="ico">${qi(cfg.ic)}</span><div><h2>${esc(cfg.t)}</h2><p>${esc(cfg.s)}</p></div><button class="q-close" data-ui="close" aria-label="Fechar">${qi('x')}</button></header><div class="q-card-b" id="qCardB"></div></section>`;

    const card=$q('qCard');
    if(!Q.reduce){layer.querySelector('.q-backdrop').animate([{opacity:0},{opacity:1}],{duration:300,fill:'both'});qFlyFrom(card,qRectOf(cfg.obj),{ms:560})}
  }else{
    const b=$q('qCardB');const top=b.scrollTop;b.classList.add('static');b.innerHTML=`<div class="wrap">${qPanelContent(v)}</div>`;b.scrollTop=top;
  }
  // slot que acabou de mudar ganha um "pop"
  const pk=JSON.stringify(S.plan.map(p=>p&&[p.type,p.opt,p.tid]));
  if(v==='agenda'&&Q.planKey&&pk!==Q.planKey&&!isNew){const old=JSON.parse(Q.planKey);S.plan.forEach((p,i)=>{const cur=p&&[p.type,p.opt,p.tid];if(JSON.stringify(cur)!==JSON.stringify(old[i])){const el=$q('slot'+i);if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}}})}
  Q.planKey=pk;
}
function qClosePanel(fromRender){
  const layer=$q('qPanel');const card=$q('qCard');const k=layer.dataset.k;const cfg=PANEL_VIEWS[k];
  if(!card||Q.reduce){layer.className='q-layer';layer.innerHTML='';return}
  layer.dataset.closing='1';
  const a=qFlyFrom(card,qRectOf(cfg&&cfg.obj),{ms:380,reverse:true,fade:true});
  layer.querySelector('.q-backdrop').animate([{opacity:1},{opacity:0}],{duration:360,fill:'both'});

function qPhone(){
  const layer=$q('qPhone'),v=UI.view,app=PHONE_VIEWS[v];
  document.body.classList.toggle('q-phone-on',!!app);
  if(!app){if(layer.classList.contains('open')&&!layer.dataset.closing)qClosePhone();Q.app=null;return}
  let fresh=false;
  if(!layer.classList.contains('open')||layer.dataset.closing){
    fresh=true;delete layer.dataset.closing;layer.className='q-phone-layer open';
    layer.innerHTML=`<div class="q-backdrop" data-ui="close"></div><div class="q-dev" id="qDev" role="dialog" aria-label="Celular"><div class="q-screen boot" id="qScreen"><div class="q-island"></div><div class="q-status"><span>${qClock()}</span><span style="display:flex;gap:6px;align-items:center">${qi('signal')}<span style="width:24px;height:12px;border:2px solid currentColor;border-radius:4px;position:relative;display:inline-block"><i style="position:absolute;inset:1px;width:${Math.max(10,Math.round(S.disp))}%;background:currentColor;border-radius:1px"></i></span></span></div><div class="q-app" id="qAppV"></div><button class="q-homebar" data-ui="homebar" aria-label="Tela inicial"><i></i></button></div></div>`;
    if(!Q.reduce){layer.querySelector('.q-backdrop').animate([{opacity:0},{opacity:1}],{duration:400,fill:'both'});qFlyFrom($q('qDev'),qRectOf('qPhoneObj')||{left:innerWidth*.3,top:innerHeight*.7,width:40,height:66},{ms:720,rot:-80})}
  }
  const host=$q('qAppV');const sameView=!fresh&&Q.app===app&&(app!=='zap'||Q.chatKey===(UI.chatOpen?UI.chat:null));
  const top=host.scrollTop;
  host.innerHTML=qPhoneApp(app);
  if(sameView){host.scrollTop=top}else{
    host.scrollTop=0;
    if(!fresh&&!Q.reduce){host.classList.remove('zoom','slide');void host.offsetWidth;
      if(app==='home'||(app==='zap'&&!UI.chatOpen&&Q.app==='zap')){host.classList.add('slide')}else{
        const ic=document.getElementById('qApp_'+app);host.classList.add('zoom')}
    }
    if(fresh)setTimeout(()=>{const s=$q('qScreen');if(s)s.classList.remove('boot')},800);
  }
  const m=$q('qMsgs');if(m&&!sameView){const zt=host;requestAnimationFrame(()=>{zt.scrollTop=zt.scrollHeight})}else if(m&&Q.typing){requestAnimationFrame(()=>{host.scrollTop=host.scrollHeight})}
  Q.app=app;Q.chatKey=app==='zap'&&UI.chatOpen?UI.chat:null;
}
function qClosePhone(){
  const layer=$q('qPhone'),dev=$q('qDev');
  if(!dev||Q.reduce){layer.className='q-phone-layer';layer.innerHTML='';return}
  layer.dataset.closing='1';
  const a=qFlyFrom(dev,qRectOf('qPhoneObj'),{ms:460,reverse:true,rot:-80,fade:true});
  layer.querySelector('.q-backdrop').animate([{opacity:1},{opacity:0}],{duration:440,fill:'both'});
  const done=()=>{if(layer.dataset.closing){layer.className='q-phone-layer';layer.innerHTML='';delete layer.dataset.closing}};
  if(a)a.onfinish=done;else done();
}

function qToast(o){
  const box=$q('qToasts');const el=document.createElement('div');el.className='q-toast'+(o.gold?' gold':'');el.setAttribute('role','status');
  el.innerHTML=`${o.k?qAvatar(o.k):`<span class="av" style="display:grid;place-items:center">${qi(o.icon||'star')}</span>`}<div style="min-width:0"><b>${esc(o.title)}</b><p>${esc(o.text)}</p></div><small>${esc(o.when||'agora')}</small>`;
  el.addEventListener('click',()=>{el.remove();if(o.k){UI.view='cel';UI.chat=o.k;UI.chatOpen=true;render()}else if(o.view){UI.view=o.view;render()}});
  box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),380)},o.ms||4300);
}
function qToastsCheck(){
  if(!S||S.report||(S.ended&&S.epilogo))return;
  const list=S.inbox.filter(m=>m.ans===null&&!Q.toasted.has(m.uid));
  let d=0;
  list.forEach(m=>{Q.toasted.add(m.uid);const k=senderOf(m);if(UI.view==='cel'&&UI.chatOpen&&UI.chat===k)return;const s=senderInfo(k);setTimeout(()=>qToast({k,title:s.nome,text:EV[m.id].text(m.data)}),400+d*900);d++});

  if(Q.msCount!==null&&ms>Q.msCount){const defs=milestoneDefs();const done=defs.filter(m=>S.milestones[m.id]).sort((a,b)=>S.milestones[b.id].week-S.milestones[a.id].week).slice(0,ms-Q.msCount);

  Q.msCount=ms;

/* ---------- confete ---------- */
function qConfetti(ms=2600){
  if(Q.reduce)return;const c=document.createElement('canvas');c.className='q-confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d'),cols=['#FFD36E','#FF8FB1','#36D2BF','#8D6BFF','#FFFFFF','#FF5C8A'];
  const P=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*innerWidth*.3,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.4}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/ms;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.42;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.globalAlpha=Math.max(0,1-k);x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(k<1)requestAnimationFrame(f);else c.remove()})(t0);
}

      L.push(pick([`Celular dentro do armário cheio de roupa, cobertor na porta. "${t.nome}" ganhou uma guia gravada.`,`Gravou "${t.nome}" no quarto, baixinho pra não acordar ninguém. Dá pra usar.`,`Três takes de "${t.nome}" no microfone de fone. O segundo ficou bom.`]));
    }
    if(n.k==='mix'){
      if(!t||t.sess<1){L.push('Não tinha faixa gravada pra mixar.');return}
      const b=t.producao;t.producao=Math.min(80,t.producao+8);fixT(t);
      L.push(`Ficou mexendo no volume da voz e no grave de "${t.nome}" até o ouvido cansar. Produção de ${b} pra ${t.producao}.`);
    }
    if(n.k==='ensaiar'){S.preparo=clamp(S.preparo+10,0,100);L.push('Ensaiou o set inteiro em frente ao espelho. Duas vezes.')}
    if(n.k==='teaser'){
      if(!t||t.lancada){L.push('O teaser ficou sem música pra mostrar.');return}
      t.hype=(t.hype||0)+20;if(t.xPresave)t.xPre=(t.xPre||0)+Math.round(8+t.gancho*.25);addReach(250+t.gancho*5,{feed:3,pista:1},null);
      L.push(`Postou quinze segundos de "${t.nome}". ${t.gancho>=55?'Os comentários pediram a música inteira.':'Uns amigos repostaram.'}`);
    }
    if(n.k==='camp'){
      if(!t){L.push('A tarefa de lançamento perdeu a música.');return}
      const r=modernSlot(0,{type:'campaign',tid:t.id,data:{kind:n.kind,tid:t.id,cost:X_CAMP[n.kind].cost}});
      S.campaigns[t.id+':'+n.kind]={offered:S.week,done:true};(r.lines||[]).forEach(l=>L.push(l));
      if(n.kind==='capa'&&t.xPresave)t.xPre=(t.xPre||0)+6;
    }
    if(n.k==='vida'){
      if(!t||!t.lancada){L.push('A música ainda não tinha saído.');return}
      const v=X_VIDA[n.kind];money(-v.cost);S.wk.music-=v.cost;t.xVida=t.xVida||{};t.xVida[n.kind]=S.week;
      if(n.kind==='remix'){addReach(1000+t.gancho*12,{pista:4,feed:2},t);L.push(`O remix de "${t.nome}" saiu com batida de pista. Tocou em duas festas no fim de semana.`)}
      if(n.kind==='acustico'){addReach(700+t.profundidade*10,{sala:4,rua:1},t);S.wk.fansDirect+=4;L.push(`Versão de "${t.nome}" só com voz e violão. Quem já gostava passou a gostar mais.`)}
      if(n.kind==='aovivo'){addReach(800+t.palco*9,{rua:2,sala:2},t);S.preparo=clamp(S.preparo+5,0,100);L.push(`Gravou "${t.nome}" ao vivo na laje, com a cidade no fundo. Ficou bonito.`)}
      if(n.kind==='trend'){const r=RI(400,2400)+t.gancho*12;addReach(r,{feed:5,pista:1},t);L.push(r>2200?`O desafio de "${t.nome}" pegou. Gente que você nem conhece fazendo o passinho.`:`Lançou o desafio de "${t.nome}". Pegou entre os amigos, ainda não saiu da bolha.`)}
    }
  });
  return L;
}

  try{SND.ctx=new AC()}catch(e){return false}
  const c=SND.ctx;SND.master=c.createGain();SND.master.gain.value=SND.on?1:0;SND.master.connect(c.destination);
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(SND.master);
  SND.music=c.createGain();SND.music.gain.value=0;SND.music.connect(comp);
  SND.sfx=c.createGain();SND.sfx.gain.value=.32;SND.sfx.connect(comp);
  // eco leve pra guitarra e cavaco
  SND.delay=c.createDelay(1);SND.delay.delayTime.value=.33;const fb=c.createGain();fb.gain.value=.28;const dl=c.createGain();dl.gain.value=.35;
  SND.delay.connect(fb);fb.connect(SND.delay);SND.delay.connect(dl);dl.connect(SND.music);
  const len=c.sampleRate;const buf=c.createBuffer(1,len,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;SND.noise=buf;
  return true;
}
function sndEnv(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
function sndOsc(type,f,t,dur,peak,dest,a=.005,f2){const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*.9);sndEnv(g,t,a,peak,dur);o.connect(g);g.connect(dest||SND.music);o.start(t);o.stop(t+a+dur+.05);return o}
function sndNoise(t,dur,peak,ftype,freq,q,dest){const c=SND.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=SND.noise;f.type=ftype;f.frequency.value=freq;if(q)f.Q.value=q;sndEnv(g,t,.002,peak,dur);s.connect(f);f.connect(g);g.connect(dest||SND.music);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
const I={
  kick:(t,v=1)=>sndOsc('sine',150,t,.38,.9*v,null,.002,42),
  snare:(t,v=1)=>{sndNoise(t,.16,.45*v,'highpass',1600);sndOsc('triangle',190,t,.08,.3*v)},
  clap:(t,v=1)=>{[0,.011,.024].forEach(d=>sndNoise(t+d,d===.024?.14:.02,.4*v,'bandpass',1300,1.2))},
  hat:(t,v=1,open)=>sndNoise(t,open?.16:.035,.16*v,'highpass',7500),
  b808:(t,f,dur=.5,v=1)=>{sndOsc('sine',f*1.04,t,dur,.7*v,null,.004,f);sndOsc('triangle',f*2,t,.06,.08*v)},
  tom:(t,f=120,v=1)=>sndOsc('sine',f*1.4,t,.22,.6*v,null,.002,f),
  jingle:(t,v=1)=>sndNoise(t,.055,.12*v,'bandpass',8500,.8),
  tung:(t,v=1)=>sndOsc('sine',160,t,.18,.45*v,null,.002,110),
  slap:(t,v=1)=>{sndOsc('triangle',340,t,.05,.25*v);sndNoise(t,.04,.18*v,'bandpass',2500,1)},
  surdo:(t,v=1)=>sndOsc('sine',78,t,.6,.75*v,null,.004,58),
  pluck:(t,f,dur=.35,v=1,wet)=>{const c=SND.ctx,o=c.createOscillator(),o2=c.createOscillator(),fl=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*1.003;
    fl.type='lowpass';fl.frequency.setValueAtTime(f*7,t);fl.frequency.exponentialRampToValueAtTime(f*1.2,t+dur);sndEnv(g,t,.003,.16*v,dur);o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(SND.music);if(wet)g.connect(SND.delay);o.start(t);o2.start(t);o.stop(t+dur+.1);o2.stop(t+dur+.1)},
  pad:(t,fs,dur,v=1)=>{const c=SND.ctx;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=900;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.05*v,t+dur*.3);g.gain.linearRampToValueAtTime(0.0001,t+dur);fl.connect(g);g.connect(SND.music);
    fs.forEach(f=>[0,.0045].forEach(dt=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f*(1+dt);o.connect(fl);o.start(t);o.stop(t+dur+.05)}))},
};
const N=n=>440*Math.pow(2,(n-69)/12);
const SND_PAT={
  rap:(s,t,bar)=>{const ch=[[57,60,64,67],[53,57,60,64]][bar%2],root=[33,29][bar%2];
    if([0,7,10].includes(s))I.kick(t);if(s===4||s===12)I.snare(t);if(s%2===0)I.hat(t,s%4?0.6:1);if(s===14&&bar%2)I.hat(t,.5);
    if(s===0)I.b808(t,N(root),.9);if(s===10)I.b808(t,N(root),.4,.8);if(s===7&&bar%2===0)I.b808(t,N(root+7),.25,.6);if(s===0)I.pad(t,ch.map(N),4*60/SND_BPM.rap*0.98)},
  funk:(s,t,bar)=>{if([0,3,6,10,13].includes(s))I.kick(t,.9);if(s===4||s===12)I.clap(t);if([2,8,14].includes(s))I.tom(t,s===8?95:130,.8);if(s===11)I.tom(t,170,.5);
    if(s===0)I.b808(t,N(bar%2?34:31),.35);if(s===6)I.b808(t,N(bar%2?34:31),.25,.7);if(s%4===2&&bar%4===3)I.hat(t,.5)},
  pagode:(s,t,bar)=>{const acc=[1,.35,.6,.35][s%4];I.jingle(t,acc);if(s===0||s===8)I.tung(t,s===0?.7:1);if(s===4||s===12)I.slap(t);if(s===12)I.surdo(t);if(s===4)I.surdo(t,.45);
    const chords=[[60,64,67,69],[57,61,64,67],[62,65,69,72],[55,59,62,65]][bar%4];if([2,6,10,14].includes(s))chords.forEach((n,k)=>I.pluck(t+k*.012,N(n+12),.18,.55,false));
    if(s===0)I.b808(t,N(chords[0]-24),.4,.5);if(s===8)I.b808(t,N(chords[2]-24),.3,.4)},
  indie:(s,t,bar)=>{const ch=[[52,59,64,67],[48,55,60,64],[55,59,62,67],[50,57,62,66]][bar%4];
    if(s===0||s===8||s===10)I.kick(t,.7);if(s===4||s===12)I.snare(t,.7);if(s%2===0)I.hat(t,.45);
    if(s%2===0){const seq=[0,1,2,3,2,1,2,3];I.pluck(t,N(ch[seq[s/2]]),.5,.7,true)}if(s===0||s===8)I.b808(t,N(ch[0]-12),.5,.45)},
};
function sndTick(){
  const c=SND.ctx;if(!c||!SND.genre)return;const spb=60/SND_BPM[SND.genre]/4;
  while(SND.next<c.currentTime+.14){
    const sw=(SND.genre==='rap'&&SND.step%2)?spb*.16:0;
    try{SND_PAT[SND.genre](SND.step,SND.next+sw,SND.bar)}catch(e){}
    SND.step=(SND.step+1)%16;if(!SND.step)SND.bar++;SND.next+=spb;
  }
}
function sndMusicLevel(){
  if(!SND.ctx)return;let v=.17;
  if(!S)v=.13;else if(document.querySelector('.xp-ov'))v=0;else if(S.report||S.ended)v=.07;else if(UI.view in PHONE_VIEWS||UI.view in PANEL_VIEWS)v=.11;
  v*=({pagode:1.35,indie:1.3})[SND.genre]||1;
  if(document.hidden)v=0;
  SND.music.gain.cancelScheduledValues(SND.ctx.currentTime);SND.music.gain.setTargetAtTime(v,SND.ctx.currentTime,.25);
}
function sndUpdate(){
  if(!SND.ctx)return;
  const g=S?genreId():(UI.startGenre||'rap');
  if(g!==SND.genre){SND.genre=g;SND.step=0;SND.bar=0;SND.next=SND.ctx.currentTime+.08;SND.delay.delayTime.value=g==='indie'?.33:.22}
  if(!SND.timer)SND.timer=setInterval(sndTick,40);
  sndMusicLevel();
}
function sndToggle(){
  SND.on=!SND.on;try{localStorage.setItem('ocorre-som',SND.on?'1':'0')}catch(e){}

  document.querySelectorAll('[data-x10="snd"]').forEach(b=>{b.innerHTML=qi(SND.on?'snd':'sndoff');b.setAttribute('aria-label',SND.on?'Tirar o som':'Ligar o som')});
}
document.addEventListener('pointerdown',()=>{if(sndInit()){if(SND.ctx.state==='suspended')SND.ctx.resume();sndUpdate()}},true);

/* efeitos */
function sfxPing(){if(!SND.ctx||!SND.on)return;const t=SND.ctx.currentTime+.01;sndOsc('sine',988,t,.12,.35,SND.sfx);sndOsc('sine',1318,t+.09,.18,.3,SND.sfx)}
function sfxChime(){if(!SND.ctx||!SND.on)return;const t=SND.ctx.currentTime+.01;[72,76,79,84].forEach((n,i)=>sndOsc('triangle',N(n),t+i*.08,.5,.28,SND.sfx))}
function sfxTick(){if(!SND.ctx||!SND.on)return;sndOsc('sine',1500,SND.ctx.currentTime+.005,.03,.18,SND.sfx)}
function sfxSleep(){if(!SND.ctx||!SND.on)return;const t=SND.ctx.currentTime+.01;[76,72,67].forEach((n,i)=>sndOsc('sine',N(n),t+i*.14,.4,.22,SND.sfx))}
function sfxDawn(){if(!SND.ctx||!SND.on)return;const t=SND.ctx.currentTime+.02;const c=SND.ctx,fl=c.createBiquadFilter(),g=c.createGain();fl.type='lowpass';fl.frequency.setValueAtTime(400,t);fl.frequency.exponentialRampToValueAtTime(2400,t+1.2);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.08,t+.6);g.gain.linearRampToValueAtTime(0.0001,t+1.7);fl.connect(g);g.connect(SND.sfx);
  [60,64,67,71].forEach(n=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=N(n);o.connect(fl);o.start(t);o.stop(t+1.8)})}
function sfxPremiere(){
  if(!SND.ctx||!SND.on)return;const c=SND.ctx,t=c.currentTime+.02,R=.85;
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=SND.noise;s.loop=true;f.type='bandpass';f.Q.value=2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(7000,t+R);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+R);g.gain.exponentialRampToValueAtTime(0.0001,t+R+.05);s.connect(f);f.connect(g);g.connect(SND.sfx);s.start(t);s.stop(t+R+.1);

  const h=t+R;sndOsc('sine',150,h,.6,1,SND.sfx,.002,40);sndNoise(h,1.4,.35,'highpass',5000,0,SND.sfx);
  [60,64,67,72,76].forEach((n,i)=>sndOsc('triangle',N(n),h+.02+i*.03,1.6,.12,SND.sfx,.01));
}

/* ganchos */
const sndToastBase=qToast;qToast=function(o){sndToastBase(o);if(o&&o.gold)sfxChime();else sfxPing()};
const sndNextBase=nextWeek;nextWeek=function(){const dawn=S&&S.report&&!S.ended;sndNextBase();if(dawn)sfxDawn()};
const sndConfirmBase=confirmWeek;confirmWeek=function(){const go=S&&!S.report&&!S.ended;sndConfirmBase();if(go)sfxSleep()};

  let fx=document.getElementById('xSndFix');if(!S){if(!fx){fx=document.createElement('button');fx.id='xSndFix';fx.className='x-sndfix';fx.dataset.x10='snd';document.body.appendChild(fx)}fx.innerHTML=qi(SND.on?'snd':'sndoff');fx.setAttribute('aria-label',SND.on?'Tirar o som':'Ligar o som')}else if(fx)fx.remove();
};
document.addEventListener('click',ev=>{

let xCovN=0;
function xSeed(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return()=>{h=Math.imul(h^(h>>>15),2246822507)>>>0;h=Math.imul(h^(h>>>13),3266489909)>>>0;h^=h>>>16;return(h>>>0)/4294967296}}
function xWords(name,max){const w=String(name||'').split(/\s+/).filter(Boolean),L=[];let cur='';w.forEach(x=>{if((cur+' '+x).trim().length>max&&cur){L.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)L.push(cur);return L.slice(0,4)}
function xCoverArt(t,sty,pal,small){
  const P=X_PAL[pal]||X_PAL.noite,r=xSeed(t.id+sty+pal),id='xc'+(++xCovN),nm=esc(t.nome||'');let b='';
  const title=(x,y,size,fill,anchor='start',rot=0)=>`<text x="${x}" y="${y}" text-anchor="${anchor}" style="font:800 ${size}px 'Baloo 2',Nunito,sans-serif;fill:${fill}" ${rot?`transform="rotate(${rot} ${x} ${y})"`:''}>${nm}</text>`;
  if(sty==='rua'){
    b+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.bg}"/><stop offset="1" stop-color="${P.fg}" stop-opacity=".55"/></linearGradient></defs><rect width="120" height="120" fill="url(#${id})"/>`;
    b+=`<circle cx="${24+r()*70}" cy="${22+r()*20}" r="${7+r()*6}" fill="${P.ac}" opacity=".9"/>`;
    let x=-6;while(x<120){const w=12+r()*14,h=28+r()*52;b+=`<rect x="${x.toFixed(1)}" y="${(120-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${P.ink}"/>`;
      for(let wy=120-h+5;wy<112;wy+=7)for(let wx=x+3;wx<x+w-3;wx+=5)if(r()<.32)b+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="2.4" height="3" fill="${P.ac}" opacity=".85"/>`;x+=w+1}
    const lx=20+r()*80;b+=`<path d="M${lx} 120V64h8" stroke="${P.ink}" stroke-width="2" fill="none"/><circle cx="${lx+9}" cy="65" r="9" fill="${P.ac}" opacity=".18"/><circle cx="${lx+9}" cy="65" r="2.2" fill="${P.ac}"/>`;
    for(let i=0;i<60;i++)b+=`<circle cx="${(r()*120).toFixed(1)}" cy="${(r()*120).toFixed(1)}" r=".5" fill="#fff" opacity=".18"/>`;
    b+=title(8,112,9,P.ac);
  }
  if(sty==='colagem'){
    b+=`<defs><pattern id="${id}" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.3" fill="${P.ink}"/></pattern></defs><rect width="120" height="120" fill="${P.bg}"/>`;
    const torn=(x,y,w,h,fill,rot)=>{let d=`M${x} ${y}`;for(let i=0;i<=8;i++)d+=` L${(x+w*i/8).toFixed(1)} ${(y+(r()-.5)*3).toFixed(1)}`;d+=` L${x+w} ${y+h}`;for(let i=8;i>=0;i--)d+=` L${(x+w*i/8).toFixed(1)} ${(y+h+(r()-.5)*3).toFixed(1)}`;return`<path d="${d}Z" fill="${fill}" transform="rotate(${rot} ${x+w/2} ${y+h/2})"/>`};
    b+=torn(8+r()*10,10+r()*8,70,52,P.fg,-6+r()*8)+torn(40+r()*10,52+r()*10,66,46,P.ac,-4+r()*10);
    b+=`<circle cx="${40+r()*40}" cy="${45+r()*30}" r="${18+r()*8}" fill="url(#${id})" opacity=".55"/><circle cx="${30+r()*60}" cy="${30+r()*50}" r="${10+r()*6}" fill="${P.bg}" stroke="${P.ink}" stroke-width="1.2"/>`;
    b+=`<rect x="${10+r()*30}" y="6" width="26" height="8" fill="#fff" opacity=".45" transform="rotate(${-12+r()*24} 40 10)"/><rect x="${70+r()*20}" y="100" width="24" height="8" fill="#fff" opacity=".45" transform="rotate(${-12+r()*24} 85 104)"/>`;
    const w=Math.min(104,(t.nome||'').length*5.2+12);b+=`<g transform="rotate(-3 60 96)"><rect x="${60-w/2}" y="86" width="${w}" height="15" fill="#fff"/><text x="60" y="97" text-anchor="middle" style="font:500 8.5px 'IBM Plex Mono',monospace;fill:#1D1533">${nm}</text></g>`;
  }
  if(sty==='tipo'){
    b+=`<rect width="120" height="120" fill="${P.bg}"/>`;const lines=xWords(t.nome,9);const long=Math.max(...lines.map(l=>l.length),3);const fs=Math.min(40,104/(long*.56));const lh=fs*.92;const y0=Math.max(fs,(120-lines.length*lh)/2+fs*.78);
    lines.forEach((l,i)=>{b+=`<text x="8" y="${(y0+i*lh).toFixed(1)}" style="font:800 ${fs.toFixed(1)}px 'Baloo 2',Nunito,sans-serif;letter-spacing:-.5px;fill:${i%2&&r()<.6?P.ac:P.fg}">${esc(l)}</text>`});
    b+=`<rect x="8" y="108" width="${20+r()*40}" height="2" fill="${P.fg}"/><text x="112" y="112" text-anchor="end" opacity=".8" style="font:700 6.5px Nunito,sans-serif;fill:${P.fg}">${esc(S?S.name:'')}</text>`;
  }
  if(sty==='desenho'){
    b+=`<rect width="120" height="120" fill="${P.bg}"/>`;const cx=60+(r()-.5)*20,cy=50+(r()-.5)*12,R=22+r()*6;let d='';for(let i=0;i<=24;i++){const a=i/24*Math.PI*2,rr=R+(r()-.5)*3.5;d+=(i?'L':'M')+(cx+Math.cos(a)*rr).toFixed(1)+' '+(cy+Math.sin(a)*rr).toFixed(1)}
    b+=`<path d="${d}Z" fill="${P.ac}" stroke="${P.fg}" stroke-width="2.4" stroke-linejoin="round"/>`;
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2+r()*.2,r1=R+6,r2=R+12+r()*6;b+=`<path d="M${(cx+Math.cos(a)*r1).toFixed(1)} ${(cy+Math.sin(a)*r1).toFixed(1)}L${(cx+Math.cos(a)*r2).toFixed(1)} ${(cy+Math.sin(a)*r2).toFixed(1)}" stroke="${P.fg}" stroke-width="2.2" stroke-linecap="round"/>`}
    b+=`<path d="M${cx-8} ${cy-3}q2 -3 4 0M${cx+4} ${cy-3}q2 -3 4 0M${cx-7} ${cy+7}q7 6 14 0" stroke="${P.fg}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    for(let i=0;i<5;i++){const x=10+r()*100,y=8+r()*80;if(Math.hypot(x-cx,y-cy)<R+16)continue;b+=`<path d="M${x} ${y-4}L${x+1.2} ${y-1.2}L${x+4} ${y}L${x+1.2} ${y+1.2}L${x} ${y+4}L${x-1.2} ${y+1.2}L${x-4} ${y}L${x-1.2} ${y-1.2}Z" fill="${P.fg}"/>`}
    b+=`<path d="M8 ${100+r()*4}q14 -6 28 0t28 0t28 0t20 0" stroke="${P.fg}" stroke-width="1.6" fill="none" opacity=".5"/>`+title(60,114,11,P.fg,'middle',-3);
  }
  if(t.capa)b+=`<rect x="4" y="4" width="112" height="112" rx="2" fill="none" stroke="${sty==='tipo'?P.fg:P.ac}" stroke-width=".8" opacity=".6"/>`;
  return`<svg class="cover ${small?'small':''}" viewBox="0 0 120 120" role="img" aria-label="Capa de ${nm}">${b}</svg>`;
}
const xCoverBase=coverSVG;
coverSVG=function(t,small=false){const c=t&&t.xCover;if(!c||c.style==='auto'||!X_COVSTY[c.style])return xCoverBase(t,small);return xCoverArt(t,c.style,c.pal,small)};
function xCoverEditor(t){
  const c=t.xCover||{style:'auto',pal:'noite'};
  return`<div class="xcov">${xTip('capa')}<span class="lab">Estilo</span><div class="xcov-sty">${Object.entries(X_COVSTY).map(([k,n])=>`<button data-x10="covSty" data-k="${k}" aria-pressed="${c.style===k}"><span class="cv">${k==='auto'?xCoverBase(t,true):xCoverArt(t,k,c.pal,true)}</span>${n}</button>`).join('')}</div>
    ${c.style!=='auto'?`<span class="lab">Cor</span><div class="xcov-pal">${Object.entries(X_PAL).map(([k,p])=>`<button data-x10="covPal" data-k="${k}" aria-pressed="${c.pal===k}" aria-label="${p.n}" title="${p.n}" style="background:linear-gradient(135deg,${p.bg} 50%,${p.fg} 50%)"></button>`).join('')}</div>`:''}
    <button class="btn" data-x10="covEdit" style="align-self:flex-start">Pronto</button></div>`;
}
// botão de mudar capa e o editor dentro do Estúdio
const xEstudio10=xEstudioHTML;
xEstudioHTML=function(){
  let h=xEstudio10();const t=getT(UI.track);if(!t)return h;
  h=h.replace(/<div class="xe-cover">([\s\S]*?)<\/svg><\/div>/,m=>m+`<button class="link xe-covbtn" data-x10="covEdit">${UI.xCovEdit===t.id?'Fechar':'Mudar capa'}</button>`);
  if(UI.xCovEdit===t.id)h=h.replace('<div class="xe-cols">',xCoverEditor(t)+'<div class="xe-cols">');
  return h;
};

/* ---------- cliques ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-x10]');if(!b||!S||b.dataset.x10==='snd')return;ev.stopPropagation();
  const a=b.dataset.x10,t=getT(UI.track);
  if(a==='tip'){xTipDone(b.dataset.k);const el=b.closest('.xtip');if(el&&!Q.reduce){el.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-6px)'}],{duration:220}).onfinish=()=>render();return}}
  if(a==='covEdit'&&t)UI.xCovEdit=UI.xCovEdit===t.id?null:t.id;
  if(a==='covSty'&&t){t.xCover={style:b.dataset.k,pal:(t.xCover&&t.xCover.pal)||pick(Object.keys(X_PAL))};save()}
  if(a==='covPal'&&t){t.xCover={...(t.xCover||{style:'rua'}),pal:b.dataset.k};save()}
  render();
},true);

</script>
<script>
/* =========================================================
   O CORRE · PRA JOGAR COM OS AMIGOS
   - primeira semana guiada
   - opções: backup, instalar como app, feedback, ranking
   - card de fim de temporada pra postar
   - ranking dos amigos (Supabase, configurado no config.js)
   ========================================================= */
const X_VERSION='11';
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this};
const XC=window.OCORRE_CONFIG||{};
const XRANK=!!(XC.supabaseUrl&&XC.supabaseKey);
const xLS={get(k,d=null){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
Object.assign(QI,{down:'M12 4v11m-5-5 5 5 5-5M5 20h14',up:'M12 20V9m-5 5 5-5 5 5M5 4h14',copy:'M8 8h11v12H8ZM5 16V4h11',share:'M12 15V3m-4 4 4-4 4 4M5 12v8h14v-8',send:'M4 12 20 4l-6 16-3-7Z'});

/* ---------- primeira semana guiada ---------- */
const X_TUT=[
  {t:'Bem-vindo ao corre',p:'Você mora no Rio e quer viver da sua música. Seu quarto é a base: cada objeto abre uma parte do jogo. Vou te guiar na primeira semana.',btn:'Bora'},
  {t:'Chegou mensagem',p:'Abre o celular. É por ele que chegam convites, shows e problemas.',tg:['#qPhoneObj','#qDock [data-k="phone"]','[data-ui="app"][data-k="zap"]'],done:()=>UI.view==='cel'||xTutAnswered()},
  {t:'Responde alguém',p:'Toca numa conversa e escolhe uma resposta. Cada escolha tem consequência, e quem fica no vácuo lembra.',tg:['.zi.unread','.zq:not([disabled])'],done:()=>xTutAnswered()},
  {t:'Agora a semana',p:'Volta pro quarto e abre o calendário na parede. Lá você decide o que fazer.',tg:['#qCal','#qDock [data-k="agenda"]','[data-ui="homebar"]','[data-xtab="agenda"]'],done:()=>UI.view==='agenda'},
  {t:'Escolhe os três períodos',p:'Trampar paga as contas. Compor e gravar fazem música. Descansar recupera energia. Tem que equilibrar.',tg:['.xw-slot.empty','.xw-act'],done:()=>S.plan.every(Boolean)},
  {t:'E tem as noites',p:'As duas noites são extras: dá pra escrever ou gravar uma guia sem gastar período. Gastam um pouco de energia.',tg:['.xw-night'],btn:'Entendi'},
  {t:'Fecha a semana',p:'Quando estiver tudo certo, vai dormir. No domingo chega o resultado.',tg:['.xw-sun .go','#qHud [data-ui="sleep"]','#qBed'],done:()=>!!S.report},
  {t:'Esse é o resultado',p:'Semana a semana, o jogo é isso. Agora é contigo. As dicas de cada parte aparecem na primeira vez que você abrir.',btn:'Bora jogar'},
];
function xTutAnswered(){return S.inbox.some(m=>m.ans!==null&&!m.auto)||!S.inbox.length}
function xTutActive(){return S&&!S.ended&&xLS.get('ocorre-tutorial')!=='done'&&(S.year||1)===1&&(S.week===1||(S.week===2&&UI.xTut===7&&!S.report))}
function xTutFinish(){xLS.set('ocorre-tutorial','done');UI.xTut=null;xTipDone('semana');xCoach()}
function xCoach(){
  document.querySelectorAll('.x-coach').forEach(e=>e.classList.remove('x-coach'));
  let box=document.getElementById('xCoachBox');
  if(!xTutActive()||(UI.menu)){if(box)box.remove();return}

  while(UI.xTut<X_TUT.length&&X_TUT[UI.xTut].done&&X_TUT[UI.xTut].done())UI.xTut++;
  if(UI.xTut===7&&!S.report&&S.week===1){UI.xTut=6}
  const st=X_TUT[UI.xTut];if(!st){xTutFinish();return}
  if(!box){box=document.createElement('div');box.id='xCoachBox';box.className='x-coachbox';box.setAttribute('role','status');document.body.appendChild(box)}
  const key=UI.xTut+':'+st.t;if(box.dataset.k!==key){box.dataset.k=key;box.innerHTML=`<span class="n">${UI.xTut+1} de ${X_TUT.length}</span><b>${esc(st.t)}</b><p>${esc(st.p)}</p><div>${st.btn?`<button class="go" data-x11="tutNext">${esc(st.btn)}</button>`:''}<button class="skip" data-x11="tutSkip">Pular tutorial</button></div>`;if(!Q.reduce)box.animate([{opacity:0,transform:'translate(-50%,10px)'},{opacity:1,transform:'translate(-50%,0)'}],{duration:260,easing:'ease-out'})}
  box.classList.toggle('top',!!document.querySelector('#modal .overlay')||(UI.view in PHONE_VIEWS));
  (st.tg||[]).forEach(sel=>{const el=document.querySelector(sel);if(el&&el.getClientRects().length)el.classList.add('x-coach')});
